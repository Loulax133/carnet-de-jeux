<style>

  --glass:rgba(28,28,30,.55); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 8px 32px rgba(0,0,0,.5); --cat-bg:#0a0a0a;

<script>
(() => {
/* ================= Yahtzee ================= */
const UPPER = [
  {id:'ones',label:'As',face:1},{id:'twos',label:'Deux',face:2},{id:'threes',label:'Trois',face:3},
  {id:'fours',label:'Quatre',face:4},{id:'fives',label:'Cinq',face:5},{id:'sixes',label:'Six',face:6}];
UPPER.forEach(c => c.hint = 'Somme des '+c.face);
const LOWER = [
  {id:'tk',label:'Brelan',hint:'3 dés pareils · somme des 5 dés'},
  {id:'fk',label:'Carré',hint:'4 dés pareils · somme des 5 dés'},
  {id:'fh',label:'Full',fixed:25,hint:'3 pareils + 2 pareils · 25'},
  {id:'ss',label:'Petite suite',fixed:30,hint:'4 dés qui se suivent · 30'},
  {id:'ls',label:'Grande suite',fixed:40,hint:'5 dés qui se suivent · 40'},
  {id:'yz',label:'Yahtzee',fixed:50,hint:'5 dés pareils · 50'},
  {id:'ch',label:'Chance',hint:'N’importe quoi · somme des 5 dés'}];
const ALL = [...UPPER,...LOWER];
const BONUS_AT = 63, BONUS = 35;
function totals(sc){
  sc = sc || {};
  const up = UPPER.reduce((a,c)=>a+(sc[c.id]||0),0);
  const bonus = up >= BONUS_AT ? BONUS : 0;
  const yb = (sc.yb||0)*100;
  const low = LOWER.reduce((a,c)=>a+(sc[c.id]||0),0) + yb;
  return {up, bonus, low, yb, total: up+bonus+low};
}
const filled = sc => ALL.filter(c => sc && sc[c.id] !== undefined && sc[c.id] !== null).length;

/* ================= 421 ================= */
const POT = 21;
const COMBOS = [
  {id:'421',t:'4·2·1',v:10,n:'Le 421'},
  {id:'111',t:'1·1·1',v:7,n:'Trois as'},
  {id:'611',t:'6·1·1',v:6,n:'Deux as + 6'},
  {id:'666',t:'6·6·6',v:6,n:'Brelan de 6'},
  {id:'511',t:'5·1·1',v:5,n:'Deux as + 5'},
  {id:'555',t:'5·5·5',v:5,n:'Brelan de 5'},
  {id:'411',t:'4·1·1',v:4,n:'Deux as + 4'},
  {id:'444',t:'4·4·4',v:4,n:'Brelan de 4'},
  {id:'311',t:'3·1·1',v:3,n:'Deux as + 3'},
  {id:'333',t:'3·3·3',v:3,n:'Brelan de 3'},
  {id:'211',t:'2·1·1',v:2,n:'Deux as + 2'},
  {id:'222',t:'2·2·2',v:2,n:'Brelan de 2'},
  {id:'suite',t:'Suite',v:2,n:'1·2·3 à 4·5·6'},
  {id:'autre',t:'Autre',v:1,n:'Le plus gros dé l’emporte'}];
const DEF_RULES = {v421:10, nen:2};
const rulesOf = L => Object.assign({}, DEF_RULES, (L && L.rules) || {});
const combo = (id, rules) => { const c = COMBOS.find(c=>c.id===id) || COMBOS[COMBOS.length-1];
  return c.id==='421' ? {...c, v:(rules||DEF_RULES).v421} : c; };
function run421(L){
  const RU = rulesOf(L);
  const st = {tokens:{}, pot:POT, phase:'charge', out:[], done:false, loser:null, log:[]};
  L.order.forEach(id => st.tokens[id]=0);
  const active = () => L.order.filter(id => !st.out.includes(id));
  for(const r of (L.rounds||[])){
    const want = combo(r.c,RU).v + (r.nen?RU.nen:0); let a;
    if(st.phase==='charge'){
      a = Math.min(want, st.pot); st.tokens[r.l] += a; st.pot -= a;
      st.log.push({...r, a, phase:'charge'});
      if(st.pot===0){ st.phase='decharge'; L.order.forEach(id=>{ if(st.tokens[id]===0 && !st.out.includes(id)) st.out.push(id); }); }
    } else {
      a = Math.min(want, st.tokens[r.w]); st.tokens[r.w] -= a; st.tokens[r.l] += a;
      st.log.push({...r, a, phase:'decharge'});
      if(st.tokens[r.w]===0 && !st.out.includes(r.w)) st.out.push(r.w);
    }
    if(st.phase==='decharge' && active().length<=1){ st.done=true; st.loser=active()[0]||r.l; break; }
  }
  st.active = active();
  return st;
}

/* ================= state & storage ================= */
const GAMES = {
  yahtzee:{name:'Yahtzee', doc:'current', min:1},
  '421':{name:'421', doc:'g421', min:2},
  skyjo:{name:'Skyjo', doc:'gsky', min:2}};
const S = { players:{}, games:[], live:{yahtzee:null,'421':null,skyjo:null}, view:'home', ready:false, confirm:null, pick:{yahtzee:new Set(),'421':new Set(),skyjo:new Set()}, sky:{scores:{},closer:null}, sgame:'yahtzee', hfilter:'all', r421:{c:'421',w:null,l:null,nen:false}, rules421:{...DEF_RULES} };
const kindOf = g => GAMES[g.game] ? g.game : 'yahtzee';
let db = null;
const $app = document.getElementById('app'), $ov = document.getElementById('overlay');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial = n => esc((n||'?').trim().charAt(0).toUpperCase());
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const plural = (n, w) => n+' '+w+(n>1?'s':'');

/* Local storage (offline version). DATA SAFETY: the key 'yz-carnet' must never change.
   Each save keeps the previous state under 'yz-carnet-prev'. New fields go through migrate(), never a reset. */
const DATA_KEY = 'yz-carnet', PREV_KEY = 'yz-carnet-prev', DATA_V = 1;
function migrate(d){
  if(!d || typeof d!=='object') return null;
  const out = {v:DATA_V, players:d.players||{}, games:Array.isArray(d.games)?d.games:[], lives:{}, rules421:d.rules421||null, savedAt:d.savedAt||0, exportedAt:d.exportedAt||0};
  if(d.live && d.live.order) out.lives.yahtzee = d.live;
  if(d.lives) Object.assign(out.lives, d.lives);
  return out;
}
function applyData(d){

const local = {
  read(key){ try{ return migrate(JSON.parse(localStorage.getItem(key)||'null')); }catch(e){ return null; } },
  load(){ const d = local.read(DATA_KEY) || local.read(PREV_KEY); if(d) applyData(d); },
  snapshot(){ return {v:DATA_V, players:S.players, games:S.games, lives:S.live, rules421:S.rules421, savedAt:Date.now(), exportedAt:S.exportedAt||0}; },
  save(){ try{ const cur = localStorage.getItem(DATA_KEY); if(cur) localStorage.setItem(PREV_KEY, cur);
      localStorage.setItem(DATA_KEY, JSON.stringify(local.snapshot())); }
    catch(e){ toast("Sauvegarde impossible sur ce téléphone. Exporte tes données par sécurité."); } }
};
async function exportData(){
  S.exportedAt = Date.now(); local.save();
  const day = new Date().toISOString().slice(0,10);
  const name = `carnet-de-jeux-${day}.json`;
  const blob = new Blob([JSON.stringify({app:'carnet-de-jeux', ...local.snapshot()}, null, 1)], {type:'application/json'});
  try{ const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Sauvegarde Carnet de jeux'}); render(); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000); render();
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => { let d; try{ d = migrate(JSON.parse(fr.result)); }catch(e){ d = null; }
    if(!d || (!Object.keys(d.players).length && !d.games.length)){ toast("Ce fichier n'est pas une sauvegarde du Carnet de jeux."); return; }
    let np=0, ng=0;
    Object.entries(d.players).forEach(([id,p])=>{ if(!S.players[id]){ S.players[id]=p; np++; } });
    const have = new Set(S.games.map(g=>g.id));
    d.games.forEach(g=>{ if(g && g.id && !have.has(g.id)){ S.games.push(g); ng++; } });
    Object.keys(d.lives||{}).forEach(k=>{ if(!S.live[k] && d.lives[k]) S.live[k]=d.lives[k]; });
    local.save(); render(); toast(`${plural(np,'joueur')} et ${plural(ng,'partie')} ajoutés`); };
  fr.readAsText(file);
}

/* ================= Skyjo ================= */
const SKY_END = 100;
function runSky(L){
  const tot = {}, closed = {}, doubled = {}, bestRound = {}; L.order.forEach(id=>{tot[id]=0;closed[id]=0;doubled[id]=0;bestRound[id]=null;});
  const log = [];
  for(const r of (L.rounds||[])){
    const fin = {...r.scores}; const c = r.closer; let dbl = false;
    if(c && fin[c] > 0 && L.order.some(id => id!==c && r.scores[id] <= r.scores[c])){ fin[c] = r.scores[c]*2; dbl = true; doubled[c]++; }
    if(c) closed[c]++;
    L.order.forEach(id => { tot[id] += fin[id]||0; if(bestRound[id]===null || r.scores[id] < bestRound[id]) bestRound[id] = r.scores[id]; });
    log.push({raw:r.scores, fin, closer:c, dbl});
  }
  const done = log.length>0 && L.order.some(id => tot[id] >= SKY_END);
  const min = Math.min(...L.order.map(id=>tot[id]));
  return {tot, closed, doubled, bestRound, log, done, winners: L.order.filter(id=>tot[id]===min), lead: min};
}
const rulesSky = (open) => `<details class="rules glass"${open?' open':''}><summary>Règles en bref</summary><ul>
  <li>Chacun a <b>12 cartes</b> face cachée en 3 rangées de 4, et en retourne 2 au départ. Les cartes valent de <b>−2 à 12</b>.</li>
  <li>À ton tour, tu prends la défausse ou la pioche. Tu échanges la carte avec une des tiennes, ou tu la jettes et retournes une carte cachée.</li>
  <li><b>Colonne de 3 cartes identiques</b> : tu la défausses, elle ne compte plus.</li>
  <li>Quand un joueur a retourné toutes ses cartes, chacun joue <b>un dernier tour</b>, puis on retourne tout et on additionne.</li>
  <li>Celui qui a fini la manche doit avoir le <b>score le plus bas, seul</b>. Sinon ses points de la manche sont <b>doublés</b>, s'ils sont positifs.</li>
  <li>La partie s'arrête quand quelqu'un atteint <b>${SKY_END} points</b>. Le plus petit total gagne.</li></ul></details>`;
function viewSky(){
  const L = S.live.skyjo;
  if(!L) return viewSetup('skyjo');

function statsS(id){
  const st = {played:0,wins:0,sum:0,best:null,closed:0,doubled:0,bestRound:null};
  S.games.filter(g=>kindOf(g)==='skyjo').forEach(g => { const r=(g.results||[]).find(r=>r.id===id); if(!r) return;
    st.played++; st.sum += r.total; st.best = st.best===null ? r.total : Math.min(st.best, r.total);
    st.closed += r.closed||0; st.doubled += r.doubled||0;
    if(r.bestRound!==null && r.bestRound!==undefined) st.bestRound = st.bestRound===null ? r.bestRound : Math.min(st.bestRound, r.bestRound);
    if((g.winners||[]).includes(id)) st.wins++; });
  st.avg = st.played ? Math.round(st.sum/st.played) : 0; st.rate = st.played ? st.wins/st.played : 0;
  return st;
}
function statsSkyView(top, ids, nameOf){

/* ================= wheel picker ================= */
function wheel({who, title, meta, opts, start, onOk, onClear}){
  let idx = Math.max(0, start);
  $ov.innerHTML = `<div class="scrim" data-close></div><div class="panel glass" role="dialog" aria-label="${esc(title)}">
    <div class="label">${esc(who)}</div><h3>${esc(title)}</h3><div class="meta">${meta}</div>
    <div class="wheel-box"><div class="wheel-band" aria-hidden="true"></div>
      <div class="wheel" id="wheel" tabindex="0" role="listbox" aria-label="${esc(title)}">${opts.map((o,i)=>`<div class="wi" role="option" data-i="${i}">${o.t}${o.s?`<span class="s">${o.s}</span>`:''}</div>`).join('')}</div></div>
    <div class="foot">${onClear?'<button class="btn ghost" data-clear>Effacer</button>':'<button class="btn ghost" data-close>Fermer</button>'}<button class="btn" data-ok>Valider</button></div></div>`;
  const w = document.getElementById('wheel'); const items = [...w.children]; const H = 52;
  const paint = () => { const mid = w.scrollTop / H;
    items.forEach((el,i)=>{ const d = Math.min(Math.abs(i-mid),3); el.style.opacity = 1 - d*0.3; el.style.transform = `scale(${1 - d*0.14})`; el.setAttribute('aria-selected', i===idx); }); };
  let raf=0; w.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>{ idx = Math.max(0,Math.min(opts.length-1, Math.round(w.scrollTop/H))); paint(); }); });
  const to = (i, smooth) => { idx = Math.max(0,Math.min(opts.length-1,i)); w.scrollTo({top: idx*H, behavior: smooth?'smooth':'auto'}); paint(); };
  requestAnimationFrame(()=>to(idx,false));
  const ok = () => { closePanel(); onOk(opts[idx]); };
  w.addEventListener('keydown', e => { if(e.key==='ArrowDown'){e.preventDefault();to(idx+1,true);} else if(e.key==='ArrowUp'){e.preventDefault();to(idx-1,true);} else if(e.key==='Enter'){e.preventDefault();ok();} });
  $ov.onclick = e => {
    if(e.target.closest('[data-close]')){ closePanel(); return; }
    const it = e.target.closest('.wi'); if(it){ to(Number(it.dataset.i), true); return; }
    if(e.target.closest('[data-ok]')) ok();
    else if(e.target.closest('[data-clear]')){ closePanel(); onClear(); }
  };
  w.focus({preventScroll:true});
}
function closePanel(){ $ov.innerHTML=''; $ov.onclick=null; }
document.addEventListener('keydown', e => { if(e.key==='Escape') closePanel(); });

function openCell(pid, cid){
  const L = S.live.yahtzee; const c = ALL.find(x=>x.id===cid); const cur = (L.scores[pid]||{})[cid];
  let opts, title = c ? c.label : 'Yahtzee bonus', meta, def = 0;
  if(cid==='yb'){ opts=[0,1,2,3,4].map(n=>({v:n,t:n?'+'+n*100:'0'})); meta='Un nouveau Yahtzee alors que la case Yahtzee est déjà à 50 rapporte 100.'; }
  else if(c.face){ opts=[0,1,2,3,4,5].map(n=>({v:n*c.face,t:String(n*c.face)})); meta=`Additionne seulement les ${c.face}. Exemple : trois ${c.face} = ${3*c.face}.`; }
  else if(c.fixed){ opts=[{v:0,t:'0'},{v:c.fixed,t:String(c.fixed)}]; def=c.fixed; meta=c.hint.split(' · ')[0]+'. Sinon, la case est barrée à 0.'; }
  else { opts=[{v:0,t:'0'}].concat(Array.from({length:26},(_,i)=>({v:i+5,t:String(i+5)}))); meta = c.id==='ch' ? 'Aucune condition : additionne les cinq dés.' : c.hint.split(' · ')[0]+', puis additionne les cinq dés, pas seulement ceux qui sont pareils.'; }
  const start = cur!==undefined && cur!==null ? cur : def;
  const set = v => { const sc = {...(L.scores[pid]||{})}; if(v===null) delete sc[cid]; else sc[cid]=v;
    L.scores = {...L.scores, [pid]: sc}; S.just = pid+cid; saveLiveSoon('yahtzee'); setTimeout(()=>{S.just=null},400); };
  wheel({who:pname(pid,L.names[pid]), title, meta, opts, start: opts.findIndex(o=>o.v===start), onOk:o=>set(o.v), onClear:()=>set(null)});
}

/* ================= render & events ================= */
function render(){
  if(!S.ready){ $app.innerHTML = `<div class="label">Carnet de jeux</div><h1>Un <em>instant</em>…</h1><p class="sub">Chargement des joueurs et des parties.</p>`; return; }
  if(S.locked){ $app.innerHTML = `<div class="label">Carnet de jeux</div><h1>Accès <em>réservé</em></h1><p class="sub">Ce carnet est personnel. Seul son propriétaire peut voir et noter les parties.</p>`; return; }
  const v = S.view;
  $app.innerHTML = v==='players'?viewPlayers():v==='stats'?viewStats():v==='history'?viewHistory():v==='yahtzee'?viewYahtzee():v==='421'?view421():v==='skyjo'?viewSky():viewHome();
  const tabv = GAMES[v] ? 'home' : v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===tabv));
  const f = document.getElementById('addp');
  if(f) f.onsubmit = async e => { e.preventDefault(); const i=document.getElementById('pname'); const n=i.value.trim(); if(!n) return;
    if(Object.values(S.players).some(p=>p.name.toLowerCase()===n.toLowerCase())){ toast(n+' est déjà dans la liste.'); return; }
    i.value=''; try{ await store.addPlayer(n); toast(n+' ajouté'); }catch(err){ toast("Impossible d'ajouter "+n+'. Réessaie.'); }
    setTimeout(()=>{const x=document.getElementById('pname'); x&&x.focus();},50); };
}
function go(v){ S.view=v; S.confirm=null; render(); window.scrollTo(0,0); }
document.getElementById('tabs').onclick = e => { const t=e.target.closest('.tab'); if(t) go(t.dataset.v); };

async function saveFinished(k){
  if(k==='yahtzee'){ const L=S.live.yahtzee;
    const results = L.order.map(id=>{const sc=L.scores[id]||{}; const t=totals(sc); return {id, name:pname(id,L.names[id]), total:t.total, up:t.up, bonus:t.bonus, yz:sc.yz||0, yb:sc.yb||0};});
    const max = Math.max(...results.map(r=>r.total));
    return {game:'yahtzee', date:Date.now(), startedAt:L.startedAt, results, winners: results.filter(r=>r.total===max).map(r=>r.id)};
  }
  if(k==='skyjo'){ const L=S.live.skyjo; const st=runSky(L);
    const results = L.order.map(id=>({id, name:pname(id,L.names[id]), total:st.tot[id], closed:st.closed[id], doubled:st.doubled[id], bestRound:st.bestRound[id]}));
    return {game:'skyjo', date:Date.now(), startedAt:L.startedAt, results, winners:st.winners, rounds:st.log.length};
  }
  const L=S.live['421']; const st=run421(L);
  const results = L.order.map(id=>({id, name:pname(id,L.names[id]), rank: id===st.loser ? L.order.length : st.out.indexOf(id)+1,
    n421: st.log.filter(r=>r.w===id && r.c==='421').length}));
  return {game:'421', date:Date.now(), startedAt:L.startedAt, results, loser:st.loser, firstOut:st.out[0]||null, rounds:st.log.length};
}

$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-a],[data-pick],[data-rm],[data-rm-yes],[data-rg],[data-rg-yes],[data-seg],[data-rule],[data-r],[data-closer],td.cell'); if(!el) return;
  if(el.matches('td.cell')){ openCell(el.dataset.p, el.dataset.c); return; }
  if(el.dataset.go){ go(el.dataset.go); return; }
  if(el.dataset.seg){ S[el.dataset.seg]=el.dataset.val; render(); return; }
  if(el.dataset.closer){ S.sky.closer = S.sky.closer===el.dataset.closer ? null : el.dataset.closer; render(); return; }
  if(el.dataset.rule){ S.rules421 = {...S.rules421, [el.dataset.rule]: Number(el.dataset.val)}; render();
    if(db){ try{ await db.doc('settings/r421').set(S.rules421); }catch(err){ toast("Le réglage n'a pas pu être enregistré."); } } else local.save(); return; }
  if(el.dataset.r){ const R=S.r421; R[el.dataset.r] = R[el.dataset.r]===el.dataset.id ? null : el.dataset.id; render(); return; }
  if(el.dataset.pick){ const s=S.pick[el.dataset.k]; s.has(el.dataset.pick)?s.delete(el.dataset.pick):s.add(el.dataset.pick); render(); return; }
  if(el.dataset.rm){ S.confirm='rm-'+el.dataset.rm; render(); return; }
  if(el.dataset.rmYes){ const id=el.dataset.rmYes; S.confirm=null; try{ await store.removePlayer(id); }catch(err){ toast('Impossible de retirer ce joueur.'); } return; }
  if(el.dataset.rg){ S.confirm='rg-'+el.dataset.rg; render(); return; }
  if(el.dataset.rgYes){ const id=el.dataset.rgYes; S.confirm=null; try{ await store.removeGame(id); toast('Partie supprimée'); }catch(err){ toast('Impossible de supprimer la partie.'); } return; }
  const a = el.dataset.a, k = el.dataset.k;
  if(a==='cancel'){ S.confirm=null; render(); }
  else if(a==='start'){ const order=[...S.pick[k]]; const names={}; order.forEach(id=>names[id]=S.players[id].name);
    S.pick[k]=new Set(); S.r421={c:'421',w:null,l:null,nen:false}; S.sky={scores:{},closer:null};
    await store.setLive(k, k==='yahtzee' ? {order, names, scores:{}, startedAt:Date.now()} : k==='skyjo' ? {order, names, rounds:[], startedAt:Date.now()} : {order, names, rounds:[], rules:{...S.rules421}, startedAt:Date.now()}); }
  else if(a==='combo'){ const i = COMBOS.findIndex(c=>c.id===S.r421.c);
    wheel({who:'Meilleure combinaison', title:'Combinaison', meta:'De la plus forte à la plus faible. Le chiffre à droite, c’est le nombre de jetons.', opts:COMBOS.map(c=>combo(c.id,rulesOf(S.live['421']))).map(c=>({v:c.id,t:c.t,s:plural(c.v,'jeton')})), start:i, onOk:o=>{S.r421.c=o.v; render();}}); }
  else if(a==='sky-score'){ const id=el.dataset.id, L=S.live.skyjo; const cur=S.sky.scores[id];
    const opts=[]; for(let v=-24; v<=144; v++) opts.push({v, t:v<0?'−'+(-v):String(v)});
    wheel({who:pname(id,L.names[id]), title:'Points de la manche', meta:'Somme des cartes restantes, de −2 à 12 chacune. Une colonne de 3 cartes identiques ne compte pas.',
      opts, start: opts.findIndex(o=>o.v===(cur===undefined?0:cur)), onOk:o=>{ S.sky.scores={...S.sky.scores,[id]:o.v}; render(); },
      onClear:()=>{ const sc={...S.sky.scores}; delete sc[id]; S.sky.scores=sc; render(); }}); }
  else if(a==='sky-round'){ const L=S.live.skyjo, R=S.sky; if(!R.closer || !L.order.every(id=>R.scores[id]!==undefined)) return;
    L.rounds=[...(L.rounds||[]), {scores:{...R.scores}, closer:R.closer}]; S.sky={scores:{},closer:null}; saveLiveSoon('skyjo'); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a==='sky-undo'){ const L=S.live.skyjo; L.rounds=(L.rounds||[]).slice(0,-1); saveLiveSoon('skyjo'); }
  else if(a==='export'){ exportData(); }
  else if(a==='nen'){ S.r421.nen=!S.r421.nen; render(); }
  else if(a==='round'){ const R=S.r421, L=S.live['421']; if(!R.w||!R.l) return;
    L.rounds = [...(L.rounds||[]), {c:R.c, w:R.w, l:R.l, nen:R.nen}];
    S.r421 = {c:'421', w:null, l:null, nen:false}; saveLiveSoon('421'); }
  else if(a==='undo'){ const L=S.live['421']; L.rounds = (L.rounds||[]).slice(0,-1); saveLiveSoon('421'); }
  else if(a==='end'){ S.confirm='end'; render(); }
  else if(a==='abandon'){ S.confirm='abandon'; render(); }
  else if(a==='abandon-yes'){ S.confirm=null; await store.setLive(k, null); }
  else if(a==='end-yes'){ S.confirm=null;
    try{ const g = await saveFinished(k); await store.addGame(g); await store.setLive(k, null); toast('Partie enregistrée'); S.sgame=k; go('stats'); }
    catch(err){ toast("La partie n'a pas pu être enregistrée. Réessaie."); render(); } }
});
$app.addEventListener('change', e => { if(e.target.id==='import-file' && e.target.files[0]){ importData(e.target.files[0]); e.target.value=''; } });
$app.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches('td.cell,[data-pick]')){ e.preventDefault(); e.target.click(); } });

/* ================= boot ================= */
async function boot(){
  render();
  const c = window.claude;
  const [d, u] = c && c.use ? await Promise.all([c.use('db').catch(()=>null), c.use('user').catch(()=>null)]) : [null,null];
  if(u && typeof u.isOwner==='function'){ try{ if(!(await u.isOwner())){ S.locked=true; S.ready=true; render(); return; } }catch(e){} }
  if(!d){ local.load(); S.ready=true; render(); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} return; }
  db = d;
  let got = 0; const mark = () => { if(++got>=4) S.ready=true; if(!$ov.innerHTML) render(); };
  db.collection('players').onSnapshot(s=>{ const p={}; s.docs.forEach(x=>p[x.id]=x.data()); S.players=p; mark(); }, ()=>{});
  db.collection('games').onSnapshot(s=>{ S.games=s.docs.map(x=>({...x.data(), id:x.id})); mark(); }, ()=>{});
  db.doc('settings/r421').onSnapshot(s=>{ if(s.exists) S.rules421={...DEF_RULES,...s.data()}; if(!$ov.innerHTML) render(); }, ()=>{});
  Object.keys(GAMES).forEach(k => {
    db.doc('live/'+GAMES[k].doc).onSnapshot(s=>{ const y = sync[k]; if(!y || (!y.busy && !y.timer)) S.live[k] = s.exists ? JSON.parse(JSON.stringify(s.data())) : null; mark(); }, ()=>{});
  });
}
boot();
})();
</script>

<script>
/* Offline + updates. Updating only replaces the app files; game data lives in localStorage and is never touched. */
window.APP_VERSION = '2';
if('serviceWorker' in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; location.reload(); });
  const offer = w => {
    const t = document.createElement('div'); t.className = 'toast glass'; t.style.display='flex'; t.style.gap='10px'; t.style.alignItems='center';
    t.innerHTML = 'Nouvelle version disponible <button class="btn" style="padding:8px 14px;font-size:13px">Mettre à jour</button>';
    t.querySelector('button').onclick = () => w.postMessage('skip');
    document.body.appendChild(t);
  };
  addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('sw.js');
      if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing;
        w.addEventListener('statechange', () => { if(w.state==='installed' && navigator.serviceWorker.controller) offer(w); }); });
      document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }catch(e){}
  });
}
</script>
