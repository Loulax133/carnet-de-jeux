  resyncAll(false); }
function mapSheet(sh, mp){
  const o = JSON.parse(JSON.stringify(sh)), keys = x => Object.fromEntries(Object.entries(x||{}).map(([k,v]) => [mp(k), v]));
  if(o.scores) o.scores = keys(o.scores);
  if(Array.isArray(o.rounds)) o.rounds = o.rounds.map(r => { const n = {...r};
    if(r.scores) n.scores = keys(r.scores); ['closer','w','l'].forEach(f => { if(r[f]) n[f] = mp(r[f]); }); return n; });
  return o;
}
let inboxBusy = false;
async function checkInbox(){
  if(db || inboxBusy || !online() || !navigator.onLine || !myPid()) return;
  inboxBusy = true;
  try{ const {m, fs} = await fb(); const me = myUid();
    const snap = await m.getDocs(m.collection(fs, 'inbox', me, 'items'));
    if(!snap.docs.length) return;
    if(!S.fr.list.length) await frLoad(true);
    let added = 0, removed = 0; const by = new Set(), later = new Set();
    for(const x of snap.docs){ const d = x.data();
      /* Jeu que cette version ne connaît pas encore (l'ami a une version plus récente) : on le laisse dans la boîte. */
      if(d.type==='game' && d.game && !known(d.game)){ later.add(x.id); continue; }
      if(d.type==='game' && d.game){ if(importReceived(d.from, d.game)===true){ added++; by.add(d.from); } }
      else if(d.type==='del' && d.gid){ const gid = 'r:'+d.from+':'+d.gid; const n = S.games.length; S.games = S.games.filter(g=>g.id!==gid); if(S.games.length<n) removed++;
        /* Une copie reliée (alias) : on oublie juste le lien, la partie gardée ici n'est pas celle de l'ami. */
        S.games.forEach(g => { if((g.alias||[]).includes(gid)) g.alias = g.alias.filter(x=>x!==gid); }); }
    }
    local.save();
    for(const x of snap.docs){ if(later.has(x.id)) continue; try{ await m.deleteDoc(x.ref); }catch(e){} }
    render();
    if(added){ const names = [...by].map(u => (S.fr.list.find(f=>f.uid===u)||{}).name || 'un ami');
      toast(`${plural(added,'partie')} reçue${added>1?'s':''} de ${names.join(' et ')}`); }
    else if(removed) toast(`${plural(removed,'partie')} retirée${removed>1?'s':''} par ton ami`);
  }catch(e){ /* hors ligne ou règles : on réessaiera */ }
  finally{ inboxBusy = false; }
}
function rememberDeletedReceived(g){ if(g && g.src){ const l = lsGet(RDEL_KEY)||[]; if(!l.includes(g.id)){ l.push(g.id); lsSet(RDEL_KEY, l.slice(-2000)); } } }

/* ================= partie en direct (spectateurs) =================
   watch/{uid}_{jeu} {owner, ownerName, k, viewers:[uid], uids:{pid:uid}, status:'live'|'done', state:JSON, result?:JSON, updatedAt}.
   Seuls les joueurs de la partie reliés à un ami confirmé sont dans viewers : un ami qui ne joue pas ne voit rien.
   Le téléphone qui saisit publie après chaque changement. Les spectateurs relisent toutes les 4 s (SDK lite, pas de temps réel).
   Fin : status 'done' + résultat, effacé 10 min plus tard. Abandon ou interrupteur coupé : effacé tout de suite.
   'yz-watch' (local) : {off, docs:{jeu:{at, done}}} = ce que ce téléphone a publié. */

S.watchList = []; S.watchSeen = new Set(); S.watch = null;
const wTimers = {}; let wPollT = null, wCheckAt = 0;
const tsMs = t => t && t.toMillis ? t.toMillis() : 0;

/* Photo du joueur prise dans le carnet du spectateur (les photos ne sont jamais envoyées) :

}
const wavLocal = (d, p, cid, name) => { const lp = watchLocalPid(d, p), ph = lp && photoOf(lp);
  return ph ? `<div class="avatar" style="${photoStyle(ph, colHex(cid) || colorOf(lp))}">${initial(name)}</div>` : wav(cid, name); };
const wdot = cid => `<span class="pdot" style="background:${colHex(cid)||'currentColor'}"></span>`;

function watchSync(){ if(db) return; Object.keys(GAMES).forEach(k => { if(S.live[k] || watchMine()[k]) watchPush(k).catch(()=>{}); }); }
function watchMeta(L){ const me = myUid(), ok = friendUids(), uids = {}, cols = {};
  L.order.forEach(p => { const pl = S.players[p]||{}; if(pl.uid) uids[p] = pl.uid; if(pl.color) cols[p] = pl.color; });
  return {uids, cols, viewers: [...new Set(Object.values(uids).filter(u => u!==me && ok.has(u)))]}; }
const watchDoc = (k, L, meta, extra) => ({owner:myUid(), ownerName:(S.acct.profile||{}).name||'Un ami', k, viewers:meta.viewers, uids:meta.uids,
  state:JSON.stringify({...L, cols:meta.cols}), ...extra});
async function watchPush(k){
  if(db || !online() || !navigator.onLine || !GAMES[k] || !GAMES[k].watch) return;
  const me = myUid(), L = S.live[k], id = me+'_'+k;
  const meta = L ? watchMeta(L) : {viewers:[]};
  if(!L || !meta.viewers.length || !watchOn()){
    const d = watchMine()[k]; if(!d) return;
    if(!L && d.done && Date.now()-d.at < WATCH_KEEP && watchOn()) return; // le résultat reste visible quelques minutes
    const {m, fs} = await fb(); await m.deleteDoc(m.doc(fs, 'watch', id));
    const n = watchMine(); delete n[k]; watchSetMine(n); return; }
  const {m, fs} = await fb();

  watchSetMine({...watchMine(), [k]:{at:Date.now()}});

  }catch(e){}

const watchWith = d => { const me = myUid(); return 'Avec ' + andList(d.st.order.filter(p => (d.uids||{})[p]!==me).map(p => esc(d.st.names[p]||'Joueur'))); };

/* ================= confettis de fin de partie (v19) =================
   Salve flat jaune/doré, comme l'icône : chaque confetti a une face claire et une face sombre, sans dégradé,
   et bascule de l'une à l'autre en tournant. Rien si « Réduire les animations » est activé. */
const CONF_TONES = [['#F7D45C','#C99417'],['#EDBE36','#A87A12'],['#FBE38A','#DDA628']];
let confRun = 0;
function celebrate(o){
  o = o || {};
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches || document.hidden) return; }catch(e){ return; }
  const run = ++confRun, old = document.getElementById('confetti'); if(old) old.remove();
  const cv = document.createElement('canvas'); cv.id = 'confetti'; cv.setAttribute('aria-hidden','true');
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35';

      round: r<.2, rot:Math.random()*6.28, vr:(Math.random()-.5)*.35, flip:Math.random()*6.28, vf:.12+Math.random()*.2, t, drift:Math.random()*6.28}); } };
  const ox = W/2, oy = o.small ? H*.38 : Math.min(H*.24, 200), pw = o.small ? Math.min(12, 7 + W/80) : Math.min(17, 9 + W/60);
  burst(ox, oy, o.small ? N : Math.round(N*.65), pw);

  const life = o.small ? 1700 : 2900, fade = o.small ? 500 : 700;
  const frame = ts => { if(run!==confRun) return; if(t0===null) t0 = ts; const el = ts - t0;

let finishing = false;
async function finishGame(k){
  if(finishing || !S.live[k]) return; finishing = true; S.confirm = null;
  try{ const live0 = JSON.parse(JSON.stringify(S.live[k]));
    const g = await saveFinished(k); const id = await store.addGame(g); watchDone(k, live0, {...g, id}); await store.setLive(k, null);
    S.yzUndo = null; S.sgame = k; openResult({g:{...g, id}, from:'end', live:live0});
    if(!db){ const saved = S.games.find(x=>x.id===id); shareGame(saved); }
    if(!db) driveAuto(); }
  catch(err){ toast("La partie n'a pas pu être enregistrée. Réessaie."); render(); }
  finishing = false;
}
/* "Corriger la dernière saisie" : retire la partie de l'historique et rouvre le jeu juste avant la dernière manche. */
async function reopenGame(){
  const R = S.result; if(!R || !R.live) return; const g = R.g, k = kindOf(g);
  if(S.live[k]){ toast('Une autre partie de '+GAMES[k].name+' est déjà en cours.'); return; }

    if(!db){ const g0 = S.games.find(x=>x.id===g.id); shareDelete(g0); }

}
/* "Rejouer avec les mêmes" : nouvelle partie, mêmes joueurs, même ordre. */
async function replay(){

  const order = (g.results||[]).map(r=>r.id).filter(id=>S.players[id]);

/* ================= animations (v29) =================

const reduceMotion = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return true; } };
let VT = null;
/* Sens d'arrivée du contenu : onglet de droite → de la droite ; écran plus profond → de la droite ; retour → de la gauche. */
const TAB_ORDER = ['home','stats','history','players'];

GAME_ORDER.forEach(k => { DEPTH[k] = 1; });
function vtDir(a, b){
  const ia = TAB_ORDER.indexOf(a), ib = TAB_ORDER.indexOf(b);
  if(ia>=0 && ib>=0) return ib>ia ? 'r' : 'l';
  const da = DEPTH[a]||0, dz = DEPTH[b]||0;

/* Chiffres qui défilent jusqu'à la nouvelle valeur et barres qui glissent, d'un rendu à l'autre du même écran.

  const step = now => { const p = Math.min(1, (now-t0)/d); el.textContent = numTxt(Math.round(from + (to-from)*ease(p)));
    if(p<1 && el.isConnected) requestAnimationFrame(step); else el.textContent = numTxt(to); };
  requestAnimationFrame(step);

function afterRender(same){

  $app.querySelectorAll('[data-ck]').forEach(el => { const k = el.dataset.ck, to = Number(el.dataset.n), from = NUMS.get(k); NUMS.set(k, to);
    if(same && !rm && from!==undefined && from!==to && isFinite(from)) tweenNum(el, from, to); });
  const bars = [...$app.querySelectorAll('[data-bk]')].map(el => { const k = el.dataset.bk, to = Number(el.dataset.w), from = BARS.get(k); BARS.set(k, to);
    return same && !rm && from!==undefined && from!==to ? [el, from, to] : null; }).filter(Boolean);
  if(bars.length){ bars.forEach(([el, from]) => { el.style.transition = 'none'; el.style.width = from+'%'; });
    void $app.offsetWidth;
    bars.forEach(([el, , to]) => { el.style.transition = 'width .4s cubic-bezier(.2,.8,.3,1)'; el.style.width = to+'%'; }); }

/* 421 (v30) : bandeau collé en haut dès que le haut de la grande liste (pot, premiers joueurs) est sorti de l'écran. */
let qOn = false;
function qFloat(){ const l = document.getElementById('q-list'), f = document.getElementById('q-float'); if(!l || !f){ qOn = false; return; }
  const on = qOn = l.getBoundingClientRect().top < -40; if(f.classList.contains('on')!==on){ f.classList.toggle('on', on); f.setAttribute('aria-hidden', String(!on)); } }

/* Où faire partir / arriver les jetons : la ligne de la grande liste si elle est à l'écran, sinon la pastille du bandeau. */
function qTarget(id){

  if(row){ const r = row.getBoundingClientRect(); if(r.bottom > 70 && r.top < innerHeight - 90) return row; }

/* 421 : les jetons passent du pot (charge) ou du meilleur (décharge) vers le plus faible. from = rectangle mesuré avant la manche. */
function flyTokens(f){

  const b = to.getBoundingClientRect(), x0 = f.from.left + f.from.width/2, y0 = f.from.top + f.from.height/2, x1 = b.left + b.width/2, y1 = b.top + b.height/2;
  /* Seulement si le départ et l'arrivée sont à l'écran : des jetons qui filent hors du cadre n'apportent rien. */

      {transform:`translate(${x1}px,${y1}px) scale(.7)`, opacity:.9}], {duration:520, delay:i*70, easing:'cubic-bezier(.4,0,.2,1)', fill:'backwards'});

  if(el.dataset.rmYes){ const id=el.dataset.rmYes; S.confirm=null; try{ await store.removePlayer(id); toast('Joueur retiré'); go('players'); }catch(err){ toast('Impossible de retirer ce joueur.'); } return; }
  if(el.dataset.rg){ S.confirm='rg-'+el.dataset.rg; render(); return; }
  if(el.dataset.rgYes){ const id=el.dataset.rgYes; S.confirm=null; if(!db){ const g0=S.games.find(g=>g.id===id); shareDelete(g0); rememberDeletedReceived(g0); } try{ await store.removeGame(id); toast('Partie supprimée'); }catch(err){ toast('Impossible de supprimer la partie.'); } return; }
  if(el.dataset.drivefile){ driveAction('drive-file', el); return; }
  const a = el.dataset.a, k = el.dataset.k;
  if(a && a.startsWith('acct-')){ acctAction(a); return; }
  if(a && a.startsWith('drive-')){ driveAction(a, el); return; }
  if(a && a.startsWith('fb-')){ fbAction(a, el); return; }
  if(a==='cancel'){ S.confirm=null; render(); }
  else if(a==='start'){ S.yzUndo=null; const order=[...S.pick[k]]; const names={}; order.forEach(id=>names[id]=S.players[id].name);
    S.pick[k]=new Set(); S.yzp=0; if(GAMES[k].resetUi) GAMES[k].resetUi();
    const L = GAMES[k].newLive(order, names); if(GAMES[k].virtual && virtOn(k)) L.virtual = true; S.virt = {};
    await store.setLive(k, L); }
  else if(a==='vtoggle'){ S.virt = {...(S.virt||{}), [k]: !virtOn(k)}; render(); }
  else if(a==='w-back'){ S.watch=null; clearTimeout(wPollT); go('home'); }
  else if(a==='res-again'){ replay(); }
  else if(a==='res-back'){ const f = S.result && S.result.from; S.result=null; go(f==='history'?'history':'home'); if(f==='watch') checkInbox(); }
  else if(a==='res-fix'){ reopenGame(); }
  else if(a==='photo-crop'){ const i=document.getElementById('edit-name'); if(i) S.edit.name=i.value; cropPanel(); }
  else if(a==='photo-rm'){ const i=document.getElementById('edit-name'); if(i) S.edit.name=i.value; S.edit.photo=null; render(); }
  else if(a==='export'){ exportData(); }
  else if(a==='edit'){ const p=S.players[S.pid]; S.edit={id:S.pid, name:p.name, color:p.color||'noir', photo:p.photo||null}; S.confirm=null; render(); }
  else if(a==='edit-cancel'){ cropSrc=null; S.edit=null; S.confirm=null; render(); }
  else if(a==='edit-save'){ const E=S.edit, i=document.getElementById('edit-name'); const n=(i?i.value:E.name).trim();
    if(!n){ toast('Le prénom ne peut pas être vide.'); return; }
    if(Object.entries(S.players).some(([pid,p])=>pid!==E.id && p.name.toLowerCase()===n.toLowerCase())){ toast(n+' existe déjà.'); return; }
    try{ await store.updatePlayer(E.id, {name:n, color:E.color, photo:E.photo||null}); S.edit=null; cropSrc=null; toast('Profil enregistré'); render(); }catch(err){ toast("Le profil n'a pas pu être enregistré."); } }
  else if(a==='end'){ S.confirm='end'; render(); }
  else if(a==='abandon'){ S.confirm='abandon'; render(); }
  else if(a==='pause'){ pauseGame(k); }
  else if(a==='resume'){ resumeGame(el.dataset.id); }
  else if(a==='resync'){ resyncAll(true); }
  else if(a==='sync-all' || a==='hsync'){ syncAll(); }
  else if(a==='resync-on' || a==='resync-off'){ lsSet(RESYNC_KEY, {...resyncState(), off:a==='resync-off'}); render(); toast(a==='resync-on' ? 'Resynchronisation chaque semaine' : 'Plus de resynchronisation automatique'); }
  else if(a==='abandon-yes'){ S.confirm=null; await store.setLive(k, null); }
  else if(a==='end-yes'){ S.confirm=null; finishGame(k); }
});
/* photo : cadrage (v23). L'original réduit reste en mémoire pendant la modification pour pouvoir recadrer. */
let cropSrc = null;
function loadPhoto(file){
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => { const M = 1400, k = Math.min(1, M/Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth*k); cv.height = Math.round(img.naturalHeight*k);
    const cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const i = document.getElementById('edit-name'); if(i && S.edit) S.edit.name = i.value;
    if(!S.edit) return;
    cropSrc = {id:S.edit.id, cv, url:cv.toDataURL('image/jpeg', 0.9), view:null};
    cropPanel(); };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Cette image n'a pas pu être lue. Essaie avec une autre photo."); };
  img.src = url;
}
function cropPanel(){
  const src = cropSrc; if(!src || !S.edit || src.id!==S.edit.id) return;
  const W = src.cv.width, H = src.cv.height, F = Math.min(280, window.innerWidth - 96);
  const s0 = F / Math.min(W, H), sMax = s0 * 5;
  let v = src.view ? {...src.view} : {s:s0, x:(F - W*s0)/2, y:(F - H*s0)/2};
  $ov.innerHTML = `<div class="scrim fade" data-close></div><div class="panel glass pop" role="dialog" aria-label="Cadrer la photo">
    <h3>Cadrer la photo</h3><div class="meta">Glisse pour déplacer, pince ou utilise le curseur pour zoomer.</div>
    <div class="crop" id="crop" style="width:${F}px;height:${F}px"><img id="crop-img" src="${src.url}" alt="" draggable="false" style="width:${W}px;height:${H}px"><div class="crop-ring" aria-hidden="true"></div></div>
    <input type="range" id="crop-zoom" class="crop-zoom" min="0" max="1000" value="0" aria-label="Zoom">
    <div class="foot"><button class="btn ghost" data-close>Annuler</button><button class="btn" data-ok>Valider</button></div></div>`;
  const box = document.getElementById('crop'), im = document.getElementById('crop-img'), zr = document.getElementById('crop-zoom');
  const clamp = () => { v.s = Math.max(s0, Math.min(sMax, v.s));
    v.x = Math.min(0, Math.max(F - W*v.s, v.x)); v.y = Math.min(0, Math.max(F - H*v.s, v.y)); };
  const paint = () => { clamp(); im.style.transform = `translate(${v.x}px,${v.y}px) scale(${v.s})`;
    zr.value = Math.round(Math.log(v.s/s0) / Math.log(sMax/s0) * 1000); };
  const zoomAt = (ns, px, py) => { ns = Math.max(s0, Math.min(sMax, ns)); const r = ns / v.s;
    v.x = px - (px - v.x)*r; v.y = py - (py - v.y)*r; v.s = ns; paint(); };
  paint();
  const pts = new Map(); let last = null;
  const pos = e => { const r = box.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
  const snap = () => { const a = [...pts.values()];
    if(a.length>=2){ const [p,q] = a; last = {x:(p.x+q.x)/2, y:(p.y+q.y)/2, d:Math.hypot(p.x-q.x, p.y-q.y)}; }
    else if(a.length===1) last = {x:a[0].x, y:a[0].y, d:0}; else last = null; };
  box.addEventListener('pointerdown', e => { e.preventDefault(); box.setPointerCapture(e.pointerId); pts.set(e.pointerId, pos(e)); snap(); });
  box.addEventListener('pointermove', e => { if(!pts.has(e.pointerId) || !last) return; pts.set(e.pointerId, pos(e));
    const a = [...pts.values()];
    if(a.length>=2){ const [p,q] = a, mx = (p.x+q.x)/2, my = (p.y+q.y)/2, d = Math.hypot(p.x-q.x, p.y-q.y);
      v.x += mx - last.x; v.y += my - last.y; if(last.d>0) zoomAt(v.s * d/last.d, mx, my); else paint(); last = {x:mx, y:my, d}; }
    else { v.x += a[0].x - last.x; v.y += a[0].y - last.y; paint(); last = {x:a[0].x, y:a[0].y, d:0}; } });
  const up = e => { pts.delete(e.pointerId); snap(); };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  box.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); zoomAt(v.s * Math.exp(-e.deltaY/400), p.x, p.y); }, {passive:false});
  zr.addEventListener('input', () => zoomAt(s0 * Math.pow(sMax/s0, zr.value/1000), F/2, F/2));
  $ov.onclick = e => {
    if(e.target.closest('[data-close]')){ closePanel(); return; }
    if(e.target.closest('[data-ok]')){ const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
      const cx = cv.getContext('2d'); cx.imageSmoothingQuality = 'high';
      cx.drawImage(src.cv, -v.x/v.s, -v.y/v.s, F/v.s, F/v.s, 0, 0, N, N);
      src.view = {...v}; closePanel();
      if(S.edit && S.edit.id===src.id){ S.edit.photo = cv.toDataURL('image/jpeg', 0.82); render(); } } };
}
$app.addEventListener('change', e => { if(e.target.id==='photo-file' && e.target.files[0]){ loadPhoto(e.target.files[0]); e.target.value=''; return; } if(e.target.id==='import-file' && e.target.files[0]){ importData(e.target.files[0]); e.target.value=''; } });
$app.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches('td.cell,[data-pick],[data-player],.item[data-go]')){ e.preventDefault(); e.target.click(); } });

/* ================= boot ================= */
async function boot(){
  render();
  const c = window.claude;
  const [d, u] = c && c.use ? await Promise.all([c.use('db').catch(()=>null), c.use('user').catch(()=>null)]) : [null,null];
  if(u && typeof u.isOwner==='function'){ try{ if(!(await u.isOwner())){ S.locked=true; S.ready=true; render(); return; } }catch(e){} }
  if(!d){ local.load(); S.ready=true; render(); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    if(S.acct.cache) fb().catch(()=>{});
    if(S.drive.on){ loadGis().catch(()=>{}); driveAuto(); }
    document.addEventListener('visibilitychange', () => { if(!document.hidden){ driveAuto(); checkInbox(); flushSoon(); watchSync(); resyncAuto(); if(S.view==='watch') watchPoll(); else watchCheck(true); } });
    addEventListener('online', () => { checkInbox(); flushSoon(); pubSoon(); watchSync(); watchCheck(true); driveAuto(); });
    setInterval(() => { if(!document.hidden && S.view!=='watch') watchCheck(true); }, 30000);
    return; }
  db = d;
  let got = 0; const mark = () => { if(++got>=4) S.ready=true; if(!$ov.innerHTML) render(); };
  db.collection('players').onSnapshot(s=>{ const p={}; s.docs.forEach(x=>p[x.id]=x.data()); S.players=p; mark(); }, ()=>{});
  db.collection('games').onSnapshot(s=>{ S.games=s.docs.map(x=>({...x.data(), id:x.id})); mark(); }, ()=>{});
  db.doc('settings/r421').onSnapshot(s=>{ if(s.exists) S.rules421={...DEF_RULES,...s.data()}; if(!$ov.innerHTML) render(); }, ()=>{});
  Object.keys(GAMES).forEach(k => {
    db.doc('live/'+GAMES[k].doc).onSnapshot(s=>{ const y = sync[k]; if(!y || (!y.busy && !y.timer)) S.live[k] = s.exists ? JSON.parse(JSON.stringify(s.data())) : null; mark(); }, ()=>{});
  });
}
boot();
})();
</script>

<script>
/* Offline + updates. Updating only replaces the app files; game data lives in localStorage and is never touched. */
window.APP_VERSION = '33';
if('serviceWorker' in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; location.reload(); });
  const offer = w => {
    const t = document.createElement('div'); t.className = 'toast glass'; t.style.display='flex'; t.style.gap='10px'; t.style.alignItems='center';
    t.innerHTML = 'Nouvelle version disponible <button class="btn" style="padding:8px 14px;font-size:13px">Mettre à jour</button>';
    t.querySelector('button').onclick = () => w.postMessage('skip');
    document.body.appendChild(t);
  };
  addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('sw.js');
      if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing;
        w.addEventListener('statechange', () => { if(w.state==='installed' && navigator.serviceWorker.controller) offer(w); }); });
      document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }catch(e){}
  });
}
</script>
