async function frClick(el){
  const d = el.dataset;
  if(d.friend){ S.fid = d.friend; go('friend'); frFetchRes(d.friend); return true; }
  if(d.fra){ frAccept(d.fra); return true; }
  if(d.frsend){ sendPast(d.frsend); return true; }
  if(d.frx){ frDrop(d.frx, d.msg || 'Fait'); if(S.view==='friend') go('players'); return true; }
  if(d.frlink){ const uid = S.fid;
    Object.entries(S.players).forEach(([id,p])=>{ if(p.uid!==uid) return;
      if(p.auto && !S.games.some(g=>(g.results||[]).some(r=>r.id===id))) delete S.players[id]; else delete p.uid; });
    const t = S.players[d.frlink], patch = {uid};
    if(t && t.guest){ const f = S.fr.list.find(x=>x.uid===uid); patch.aka = [...(t.aka||[]), t.guest]; patch.guest = null; if(f) patch.name = String(f.name).slice(0,24); }
    await store.updatePlayer(d.frlink, patch); sendPast(uid, true); toast('Joueur relié'); return true; }
  if(d.frnew){ const uid = S.fid, f = S.fr.list.find(x=>x.uid===uid); if(!f || pidOfUid(uid)) return true;
    const id = uid_(); S.players[id] = {name:String(f.name||'Ami').slice(0,24), uid, createdAt:Date.now()}; local.save(); toast('Joueur créé'); S.pid = id; go('player'); return true; }
  if(d.me){ const me = myUid(); if(!me) return true;
    for(const [id,p] of Object.entries(S.players)) if(p.uid===me && id!==d.me) await store.updatePlayer(id, {uid:null});
    await store.updatePlayer(d.me, {uid:me}); toast('C’est noté'); pubSoon(); return true; }
  if(d.share){ const on = d.share==='1'; const st = lsGet(PUB_KEY) || {};
    lsSet(PUB_KEY, on ? {} : {off:true, has:true}); render(); pubSoon(); toast(on ? 'Tes amis verront tes résultats' : 'Tes résultats ne sont plus partagés'); return true; }
  if(d.wshare){ const on = d.wshare==='1'; lsSet(WATCH_KEY, {...(lsGet(WATCH_KEY)||{}), off:!on}); render(); watchSync();
    toast(on ? 'Les joueurs pourront suivre tes parties' : 'Tes parties en cours ne sont plus visibles'); return true; }
  if(d.a==='fr-rm'){ S.confirm = 'frrm'; render(); return true; }
  return false;
}


/* ================= parties partagées (boîte aux lettres) =================
   inbox/{uid}/items/{id} {from, type:'game'|'del', game|gid, sentAt}. Seuls les amis confirmés écrivent, seul le
   destinataire lit et supprime. Le destinataire range la partie dans SON historique local puis vide sa boîte :
   au repos, le serveur ne garde rien. On n'envoie que les parties saisies sur ce téléphone (jamais une partie reçue).
   Chez le destinataire, la partie a l'id 'r:<expéditeur>:<id d'origine>' : un renvoi ne crée jamais de doublon. */
const OUT_KEY = 'yz-outbox', RDEL_KEY = 'yz-recv-del';
const friendUids = () => new Set(friendsOk().map(f=>f.uid));
function gameTargets(g){
  if(g.src) return [];
  const me = myUid(), ok = friendUids();
  return [...new Set((g.results||[]).map(r => (S.players[r.id]||{}).uid).filter(u => u && u!==me && ok.has(u)))];
}
function gamePayload(g){
  const who = {};
  (g.results||[]).forEach(r => { const p = S.players[r.id]; who[r.id] = {uid:(p && p.uid) || null, name: pname(r.id, r.name)}; });
  const {sentTo, ...rest} = g;
  return JSON.parse(JSON.stringify({...rest, who}));
}
const outbox = () => lsGet(OUT_KEY) || [];
function queue(items){ if(!items.length) return; lsSet(OUT_KEY, outbox().concat(items)); flushSoon(); }
let flushT = null, flushing = false;
function flushSoon(){ clearTimeout(flushT); flushT = setTimeout(()=>flushOut().catch(()=>{}), 800); }
async function flushOut(){
  if(flushing || !online() || !navigator.onLine) return; const q = outbox(); if(!q.length) return;
  flushing = true;
  try{ const {m, fs} = await fb(); const me = myUid(); let left = [...q];
    for(const it of q){
      try{ const id = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
        await m.setDoc(m.doc(fs, 'inbox', it.to, 'items', id), it.type==='del'
          ? {from:me, type:'del', gid:it.gid, sentAt:m.serverTimestamp()}
          : {from:me, type:'game', game:it.game, sentAt:m.serverTimestamp()});
        left = left.filter(x=>x!==it);
        if(it.type==='game'){ const g = S.games.find(x=>x.id===it.gid); if(g){ g.sentTo = [...new Set([...(g.sentTo||[]), it.to])]; } }
      }catch(e){ if(/permission|PERMISSION/.test(String(e.code||e.message))) left = left.filter(x=>x!==it); /* plus amis : on abandonne */ else break; }
    }
    lsSet(OUT_KEY, left); local.save();
  } finally { flushing = false; }
}
function shareGame(g){ if(db || !g || !online()) return; queue(gameTargets(g).map(to => ({to, type:'game', gid:g.id, game:gamePayload(g)}))); }
function shareDelete(g){ if(db || !g || !online()) return; queue((g.sentTo||[]).map(to => ({to, type:'del', gid:g.id}))); }
function sharedWith(uid){ const pid = pidOfUid(uid); if(!pid) return {all:0, todo:[]};
  const mine = S.games.filter(g => !g.src && (g.results||[]).some(r=>r.id===pid));
  return {all:mine.length, todo: mine.filter(g => !(g.sentTo||[]).includes(uid) && !outbox().some(x=>x.to===uid && x.gid===g.id))}; }
function sendPast(uid, quiet){ const {todo} = sharedWith(uid);
  queue(todo.map(g => ({to:uid, type:'game', gid:g.id, game:gamePayload(g)})));
  if(quiet) return;
  toast(todo.length ? `${plural(todo.length,'partie')} en route` : 'Tout est déjà envoyé'); render(); }

/* ---- réception ---- */
function resolvePlayer(w, sender, senderName){
  const me = myUid();
  if(w.uid && w.uid===me) return myPid();
  if(w.uid){ const pid = pidOfUid(w.uid); if(pid) return pid;
    const f = S.fr.list.find(x=>x.uid===w.uid && x.status==='ok'), name = (f && f.name) || w.name;
    const taken = Object.values(S.players).some(p => p.name.toLowerCase()===String(name).toLowerCase());
    const id = uid(); S.players[id] = {name:(taken ? `${name} (de ${senderName})` : name).slice(0,40), uid:w.uid, createdAt:Date.now()}; return id; }
  const label = `${w.name} (invité de ${senderName})`;
  const g = Object.entries(S.players).find(([id,p]) => (p.guest && p.guest.from===sender && p.guest.name===w.name) || (p.aka||[]).some(a => a.from===sender && a.name===w.name));
  if(g) return g[0];
  const id = uid(); S.players[id] = {name:label.slice(0,40), guest:{from:sender, name:w.name}, createdAt:Date.now()}; return id;
}
function importReceived(sender, game){
  const gid = 'r:'+sender+':'+game.id;
  if(S.games.some(g=>g.id===gid) || (lsGet(RDEL_KEY)||[]).includes(gid)) return false;
  const f = S.fr.list.find(x=>x.uid===sender), senderName = (f && f.name) || 'un ami';
  const map = {}; Object.entries(game.who||{}).forEach(([pid,w]) => { map[pid] = resolvePlayer(w, sender, senderName); });
  const mp = id => map[id] || id;
  const results = (game.results||[]).map(r => ({...r, id:mp(r.id), name: (S.players[mp(r.id)]||{}).name || r.name}));
  const {who, ...g} = game;
  if(g.sheet) g.sheet = mapSheet(g.sheet, mp);
  S.games.push({...g, id:gid, results, winners:(g.winners||[]).map(mp), loser: g.loser ? mp(g.loser) : g.loser, firstOut: g.firstOut ? mp(g.firstOut) : g.firstOut, src:{from:sender, name:senderName, id:game.id}});
  return true;
}
function mapSheet(sh, mp){
  const o = JSON.parse(JSON.stringify(sh)), keys = x => Object.fromEntries(Object.entries(x||{}).map(([k,v]) => [mp(k), v]));
  if(o.scores) o.scores = keys(o.scores);
  if(Array.isArray(o.rounds)) o.rounds = o.rounds.map(r => { const n = {...r};
    if(r.scores) n.scores = keys(r.scores); ['closer','w','l'].forEach(f => { if(r[f]) n[f] = mp(r[f]); }); return n; });
  return o;
}
let inboxBusy = false;
async function checkInbox(){
  if(db || inboxBusy || !online() || !navigator.onLine || !myPid()) return;
  inboxBusy = true;
  try{ const {m, fs} = await fb(); const me = myUid();
    const snap = await m.getDocs(m.collection(fs, 'inbox', me, 'items'));
    if(!snap.docs.length) return;
    if(!S.fr.list.length) await frLoad(true);
    let added = 0, removed = 0; const by = new Set();
    for(const x of snap.docs){ const d = x.data();
      if(d.type==='game' && d.game){ if(importReceived(d.from, d.game)){ added++; by.add(d.from); } }
      else if(d.type==='del' && d.gid){ const gid = 'r:'+d.from+':'+d.gid; const n = S.games.length; S.games = S.games.filter(g=>g.id!==gid); if(S.games.length<n) removed++; }
    }
    local.save();
    for(const x of snap.docs){ try{ await m.deleteDoc(x.ref); }catch(e){} }
    render();
    if(added){ const names = [...by].map(u => (S.fr.list.find(f=>f.uid===u)||{}).name || 'un ami');
      toast(`${plural(added,'partie')} reçue${added>1?'s':''} de ${names.join(' et ')}`); }
    else if(removed) toast(`${plural(removed,'partie')} retirée${removed>1?'s':''} par ton ami`);
  }catch(e){ /* hors ligne ou règles : on réessaiera */ }
  finally{ inboxBusy = false; }
}
function rememberDeletedReceived(g){ if(g && g.src){ const l = lsGet(RDEL_KEY)||[]; if(!l.includes(g.id)){ l.push(g.id); lsSet(RDEL_KEY, l.slice(-2000)); } } }

/* ================= partie en direct (spectateurs) =================
   watch/{uid}_{jeu} {owner, ownerName, k, viewers:[uid], uids:{pid:uid}, status:'live'|'done', state:JSON, result?:JSON, updatedAt}.
   Seuls les joueurs de la partie reliés à un ami confirmé sont dans viewers : un ami qui ne joue pas ne voit rien.
   Le téléphone qui saisit publie après chaque changement. Les spectateurs relisent toutes les 4 s (SDK lite, pas de temps réel).
   Fin : status 'done' + résultat, effacé 10 min plus tard. Abandon ou interrupteur coupé : effacé tout de suite.
   'yz-watch' (local) : {off, docs:{jeu:{at, done}}} = ce que ce téléphone a publié. */
const WATCH_KEY = 'yz-watch', WATCH_POLL = 4000, WATCH_KEEP = 10*60000, WATCH_MAX_AGE = 3*3600000;
const watchOn = () => !(lsGet(WATCH_KEY)||{}).off;
const watchMine = () => (lsGet(WATCH_KEY)||{}).docs || {};
const watchSetMine = docs => lsSet(WATCH_KEY, {...(lsGet(WATCH_KEY)||{}), docs});
S.watchList = []; S.watchSeen = new Set(); S.watch = null;
const wTimers = {}; let wPollT = null, wCheckAt = 0;
const tsMs = t => t && t.toMillis ? t.toMillis() : 0;
const colHex = cid => { const c = COLORS.find(x=>x.id===cid); return c && c.c ? c.c : null; };
const wav = (cid, name) => { const c = colHex(cid); return `<div class="avatar" style="${c?`background:${c};color:${inkOn(c)}`:''}">${initial(name)}</div>`; };
const wdot = cid => `<span class="pdot" style="background:${colHex(cid)||'currentColor'}"></span>`;
const andList = a => a.length>1 ? a.slice(0,-1).join(', ')+' et '+a[a.length-1] : (a[0]||'');
function watchSoon(k){ if(db) return; clearTimeout(wTimers[k]); wTimers[k] = setTimeout(()=>watchPush(k).catch(()=>{}), 700); }
function watchSync(){ if(db) return; Object.keys(GAMES).forEach(k => { if(S.live[k] || watchMine()[k]) watchPush(k).catch(()=>{}); }); }
function watchMeta(L){ const me = myUid(), ok = friendUids(), uids = {}, cols = {};
  L.order.forEach(p => { const pl = S.players[p]||{}; if(pl.uid) uids[p] = pl.uid; if(pl.color) cols[p] = pl.color; });
  return {uids, cols, viewers: [...new Set(Object.values(uids).filter(u => u!==me && ok.has(u)))]}; }
const watchDoc = (k, L, meta, extra) => ({owner:myUid(), ownerName:(S.acct.profile||{}).name||'Un ami', k, viewers:meta.viewers, uids:meta.uids,
  state:JSON.stringify({...L, cols:meta.cols}), ...extra});
async function watchPush(k){
  if(db || !online() || !navigator.onLine) return;
  const me = myUid(), L = S.live[k], id = me+'_'+k;
  const meta = L ? watchMeta(L) : {viewers:[]};
  if(!L || !meta.viewers.length || !watchOn()){
    const d = watchMine()[k]; if(!d) return;
    if(!L && d.done && Date.now()-d.at < WATCH_KEEP && watchOn()) return; // le résultat reste visible quelques minutes
    const {m, fs} = await fb(); await m.deleteDoc(m.doc(fs, 'watch', id));
    const n = watchMine(); delete n[k]; watchSetMine(n); return; }
  const {m, fs} = await fb();
  await m.setDoc(m.doc(fs, 'watch', id), watchDoc(k, L, meta, {status:'live', updatedAt:m.serverTimestamp()}));
  watchSetMine({...watchMine(), [k]:{at:Date.now()}});
}
async function watchDone(k, L, g){
  if(db || !online() || !L) return;
  const meta = watchMeta(L); if(!meta.viewers.length || !watchOn()) return;
  watchSetMine({...watchMine(), [k]:{at:Date.now(), done:true}}); clearTimeout(wTimers[k]);
  try{ const {m, fs} = await fb();
    await m.setDoc(m.doc(fs, 'watch', myUid()+'_'+k), watchDoc(k, L, meta, {status:'done', result:JSON.stringify({...g, cols:meta.cols}), updatedAt:m.serverTimestamp()}));
  }catch(e){}
}
const watchWith = d => { const me = myUid(); return 'Avec ' + andList(d.st.order.filter(p => (d.uids||{})[p]!==me).map(p => esc(d.st.names[p]||'Joueur'))); };
async function watchCheck(force){
  if(db || !online() || !navigator.onLine || document.hidden) return;
  if(!force && Date.now()-wCheckAt < 10000) return; wCheckAt = Date.now();
  try{ const {m, fs} = await fb(); const me = myUid(), now = Date.now();
    const snap = await m.getDocs(m.query(m.collection(fs, 'watch'), m.where('viewers', 'array-contains', me)));
    const before = JSON.stringify(S.watchList.map(d=>d.id+d.st.startedAt));
    S.watchList = snap.docs.map(x => ({id:x.id, ...x.data()}))
      .filter(d => d.status==='live' && d.owner!==me && now - tsMs(d.updatedAt) < WATCH_MAX_AGE)
      .map(d => { let st = null; try{ st = JSON.parse(d.state); }catch(e){} return {...d, st}; }).filter(d => d.st && d.st.order);
    if(S.view==='home' && JSON.stringify(S.watchList.map(d=>d.id+d.st.startedAt))!==before) render();
    const fresh = S.watchList.find(d => !S.watchSeen.has(d.id+':'+d.st.startedAt));
    if(fresh && !$ov.innerHTML && S.view!=='watch') watchInvite(fresh);
  }catch(e){ /* hors ligne ou règles pas encore publiées */ }
}
function watchInvite(d){
  S.watchList.forEach(x => S.watchSeen.add(x.id+':'+x.st.startedAt));
  $ov.innerHTML = `<div class="scrim" data-close></div><div class="panel glass" role="dialog" aria-label="Partie en cours">
    <div class="label"><span class="live-dot"></span>En direct</div><h3>${esc(d.ownerName)} joue au ${GAMES[d.k].name} avec toi</h3>
    <div class="meta">${watchWith(d)}. Tu peux suivre les scores sur ton téléphone, sans rien modifier.</div>
    <div class="foot"><button class="btn ghost" data-close>Plus tard</button><button class="btn" data-wgo>Suivre la partie</button></div></div>`;
  $ov.onclick = e => { if(e.target.closest('[data-wgo]')){ closePanel(); watchOpen(d.id); } else if(e.target.closest('[data-close]')) closePanel(); };
}
function watchOpen(id){
  const d = S.watchList.find(x=>x.id===id); S.watchSeen.add(id+':'+(d?d.st.startedAt:''));
  S.watch = {id, d:d||null, gone:false, err:false}; go('watch'); watchPoll().then(watchLoop);
}
function watchLoop(){ clearTimeout(wPollT); if(S.view!=='watch' || !S.watch) return;
  wPollT = setTimeout(async () => { if(!document.hidden) await watchPoll(); watchLoop(); }, WATCH_POLL); }
async function watchPoll(){
  const W = S.watch; if(!W) return;
  try{ const {m, fs} = await fb(); const s = await m.getDoc(m.doc(fs, 'watch', W.id));
    if(S.watch!==W || S.view!=='watch') return;
    if(!s.exists()){ W.gone = true; W.err = false; render(); return; }
    const d = s.data();
    if(d.status==='done' && d.result){ let g = null; try{ g = JSON.parse(d.result); }catch(e){}
      if(g){ S.watch = null; clearTimeout(wPollT); S.watchList = S.watchList.filter(x=>x.id!==W.id);
        S.result = {g, from:'watch', owner:d.ownerName}; go('result'); return; } }
    let st = null; try{ st = JSON.parse(d.state); }catch(e){}
    if(!st || !st.order){ W.gone = true; render(); return; }
    W.d = {...d, st}; W.gone = false; W.err = false; render();
  }catch(e){ if(S.watch===W){ W.err = true; render(); } }
}
function viewWatch(){
  const W = S.watch; if(!W) return viewHome();
  const back = `<button class="back" data-a="w-back">← Jeux</button>`;
  if(W.gone) return back + `<div class="label">En direct</div><h1>Partie <em>arrêtée</em></h1><p class="sub">Cette partie n'est plus en ligne : elle a été abandonnée, ou elle est finie depuis un moment. Si tu y as joué, elle arrivera dans ton historique.</p>`;
  if(!W.d) return back + `<div class="label">En direct</div><h1>Un <em>instant</em>…</h1><p class="sub">${W.err ? 'Pas de connexion. On réessaie…' : 'Chargement de la partie.'}</p>`;
  const d = W.d, L = d.st, me = myUid(), cols = L.cols||{};
  const P = {mine: p => (d.uids||{})[p]===me, nm: p => esc(L.names[p]||'Joueur'), av: p => wav(cols[p], L.names[p]), dot: p => wdot(cols[p])};
  const age = Date.now() - tsMs(d.updatedAt);
  return `${back}<div class="label"><span class="live-dot"></span>En direct · partie de ${esc(d.ownerName)}</div>
  <h1>Le <em>${GAMES[d.k].name}</em></h1>
  <p class="sub">${W.err ? 'Connexion perdue, on réessaie…' : age > 120000 ? `Dernier score noté il y a ${Math.round(age/60000)} min.` : 'Les scores se mettent à jour tout seuls.'}</p>
  ${d.k==='yahtzee' ? watchYz(L, P) : d.k==='skyjo' ? watchSky(L, P) : watch421(L, P)}
  <p class="note">Tu regardes la partie : seul ${esc(d.ownerName)} peut noter les scores.</p>`;
}
function watchYz(L, P){
  const ids = L.order, T = ids.map(p => totals(L.scores[p]||{})), f = ids.map(p => filled(L.scores[p]));
  const turn = ids.length>1 && Math.min(...f) < ALL.length ? f.indexOf(Math.min(...f)) : -1;
  const me = p => P.mine(p) ? ' me' : '';
  const v = (p, cid) => { const x = (L.scores[p]||{})[cid]; const has = x!==undefined && x!==null;
    return `<td class="v${me(p)}${has ? (x===0 && cid!=='yb' ? ' zero' : '') : ' empty'}">${has ? (cid==='yb' ? (x?'+'+x*100:'0') : x) : '–'}</td>`; };
  const row = c => `<tr><td class="cat">${c.label}</td>${ids.map(p=>v(p, c.id)).join('')}</tr>`;
  const sum = (label, key, cls='sum') => `<tr class="${cls}"><td class="cat">${label}</td>${ids.map((p,i)=>`<td class="${me(p).trim()}">${T[i][key]}</td>`).join('')}</tr>`;
  const sorted = ids.map((p,i)=>({p, t:T[i].total})).sort((a,b)=>b.t-a.t);
  return `${ids.length>1 ? `<div class="pstrip">${sorted.map(x=>`<span class="pchip static">${P.dot(x.p)}${P.nm(x.p)} <b>${x.t}</b></span>`).join('')}</div>` : ''}
  <div class="sheet-wrap glass dense"><table class="sheet wsheet">
    <thead><tr><th class="cat"></th>${ids.map((p,i)=>`<th class="${me(p).trim()}">${P.av(p)}${P.nm(p)}${i===turn?`<div class="hint">${P.mine(p)?'ton tour':'son tour'}</div>`:''}</th>`).join('')}</tr></thead>
    <tbody>
      <tr class="section"><td class="cat label">Section haute</td>${ids.map(()=>'<td></td>').join('')}</tr>
      ${UPPER.map(row).join('')}
      ${sum('Sous-total','up')}${sum('Prime','bonus')}
      <tr class="section"><td class="cat label">Section basse</td>${ids.map(()=>'<td></td>').join('')}</tr>
      ${LOWER.map(row).join('')}
      <tr><td class="cat">Yahtzee bonus</td>${ids.map(p=>v(p,'yb')).join('')}</tr>
      ${sum('Section basse','low')}${sum('Total','total','total')}
    </tbody></table></div>`;
}
function watch421(L, P){
  const st = run421(L), RU = rulesOf(L);
  const rank = id => { const i = st.out.indexOf(id); return i<0 ? '' : (i===0?'1er':(i+1)+'e')+' sorti'; };
  const players = L.order.map(id => { const out = st.out.includes(id), t = st.tokens[id];
    return `<div class="item${out?' out':''}">${P.av(id)}<div class="grow"><div class="name">${P.nm(id)}${P.mine(id)?' <span class="hint">· toi</span>':''}</div><div class="meta">${out ? rank(id) : ''}</div>
      <div class="bar"><i style="width:${Math.round(t/POT*100)}%"></i></div></div><div class="tok">${t}<small>jeton${t>1?'s':''}</small></div></div>`; }).join('');
  const last = st.log.slice(-5).reverse();
  return `<p class="sub" style="margin-top:-6px">${st.phase==='charge' ? `Charge · ${plural(st.pot,'jeton')} au pot` : 'Décharge · pot vide'}</p>
  <div class="glass" style="padding:8px 16px"><div class="list">${players}</div></div>
  ${st.log.length ? `<h2>Manches</h2><div class="glass" style="padding:14px 18px"><div class="log">${last.map((r,i)=>`<div><b>${st.log.length-i}.</b> ${combo(r.c,RU).t}${r.nen?' + nénette':''} · ${r.phase==='charge' ? `${P.nm(r.l)} prend ${r.a}` : `${P.nm(r.w)} donne ${r.a} à ${P.nm(r.l)}`}</div>`).join('')}</div></div>` : ''}`;
}
function watchSky(L, P){
  const st = runSky(L), order = [...L.order].sort((a,b)=>st.tot[a]-st.tot[b]);
  const maxT = Math.max(SKY_END, ...L.order.map(id=>st.tot[id]));
  const standings = order.map((id,i) => { const t = st.tot[id];
    return `<div class="item">${P.av(id)}<div class="grow"><div class="name">${P.nm(id)}${P.mine(id)?' <span class="hint">· toi</span>':''}</div>
      <div class="meta">${i===0 && st.log.length ? 'En tête' : t>=SKY_END-20 ? 'Reste '+Math.max(0,SKY_END-t)+' avant '+SKY_END : ''}</div>
      <div class="bar"><i style="width:${Math.max(0,Math.round(t/maxT*100))}%"></i></div></div><div class="tok">${t}<small>pts</small></div></div>`; }).join('');
  const rows = st.log.map((r,i)=>`<tr><td style="text-align:left" class="meta">M${i+1}</td>${L.order.map(id=>`<td>${r.fin[id]}${r.closer===id?(r.dbl?' <span class="meta">×2</span>':' <span class="meta">•</span>'):''}</td>`).join('')}</tr>`).reverse().join('');
  return `<p class="sub" style="margin-top:-6px">Manche ${st.log.length+1} · le plus petit total gagne.</p>
  <div class="glass" style="padding:8px 16px"><div class="list">${standings}</div></div>
  ${st.log.length ? `<h2>Manches</h2><div class="glass tbl-wrap" style="padding:4px 12px"><table class="stats">
    <thead><tr><th></th>${L.order.map(id=>`<th>${P.dot(id)}${P.nm(id)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    <p class="hint" style="margin:8px 0">• a fini la manche · ×2 points doublés</p></div>` : ''}`;
}

/* ================= fin de partie ================= */
/* Enregistre la partie, l'efface du direct et ouvre l'écran des résultats.
   On garde une copie de la partie en cours pour pouvoir corriger la dernière saisie juste après. */
let finishing = false;
async function finishGame(k){
  if(finishing || !S.live[k]) return; finishing = true; S.confirm = null;
  try{ const live0 = JSON.parse(JSON.stringify(S.live[k]));
    const g = await saveFinished(k); const id = await store.addGame(g); watchDone(k, live0, {...g, id}); await store.setLive(k, null);
    S.yzUndo = null; S.result = {g:{...g, id}, from:'end', live:live0}; S.sgame = k; go('result');
    if(!db){ const saved = S.games.find(x=>x.id===id); shareGame(saved); }
    if(!db && S.drive.on && tokNow()) driveRun(driveBackupNow, false); }
  catch(err){ toast("La partie n'a pas pu être enregistrée. Réessaie."); render(); }
  finishing = false;
}
/* "Corriger la dernière saisie" : retire la partie de l'historique et rouvre le jeu juste avant la dernière manche. */
async function reopenGame(){
  const R = S.result; if(!R || !R.live) return; const g = R.g, k = kindOf(g);
  if(S.live[k]){ toast('Une autre partie de '+GAMES[k].name+' est déjà en cours.'); return; }
  const L = JSON.parse(JSON.stringify(R.live));
  try{
    if(!db){ const g0 = S.games.find(x=>x.id===g.id); shareDelete(g0); }
    await store.removeGame(g.id);
    if(k==='421' && (L.rounds||[]).length){ const r = L.rounds.pop(); S.r421 = {c:r.c, w:r.w, l:r.l, nen:!!r.nen}; }
    if(k==='skyjo' && (L.rounds||[]).length){ const r = L.rounds.pop(); S.sky = {scores:{...r.scores}, closer:r.closer}; }
    S.result = null; await store.setLive(k, L); go(k); toast('Partie rouverte : corrige puis valide.');
  }catch(err){ toast("La partie n'a pas pu être rouverte. Réessaie."); }
}
/* "Rejouer avec les mêmes" : nouvelle partie, mêmes joueurs, même ordre. */
async function replay(){
  const R = S.result; if(!R) return; const g = R.g, k = kindOf(g);
  if(S.live[k]){ toast('Une partie de '+GAMES[k].name+' est déjà en cours.'); S.result=null; go(k); return; }
  const order = (g.results||[]).map(r=>r.id).filter(id=>S.players[id]);
  if(order.length < GAMES[k].min){ toast('Il manque des joueurs pour relancer cette partie.'); return; }
  const names = {}; order.forEach(id=>names[id]=S.players[id].name);
  S.yzp=0; S.yzUndo=null; S.r421={c:'421',w:null,l:null,nen:false}; S.sky={scores:{},closer:null}; S.result=null;
  await store.setLive(k, k==='yahtzee' ? {order, names, scores:{}, startedAt:Date.now()} : k==='skyjo' ? {order, names, rounds:[], startedAt:Date.now()} : {order, names, rounds:[], rules:{...S.rules421}, startedAt:Date.now()});
  go(k);
}
/* Fiche de score complète d'une partie terminée (g.sheet, depuis la v16). Colonnes dans l'ordre de jeu. */
function viewSheet(g){
  const k = kindOf(g), sh = g.sheet, ids = (g.results||[]).map(r=>r.id);
  const nmOf = id => { const r = (g.results||[]).find(x=>x.id===id); return esc(pname(id, r ? r.name : '')); };
  const title = k==='yahtzee' ? 'Fiche de score' : 'Manches';
  if(!sh) return `<h2>${title}</h2><p class="hint">Le détail n’est gardé que pour les parties terminées depuis la mise à jour de fin octobre 2026.</p>`;
  const head = `<thead><tr><th></th>${ids.map(id=>`<th>${dot(id)}${nmOf(id)}</th>`).join('')}</tr></thead>`;
  if(k==='yahtzee'){
    const sc = id => (sh.scores||{})[id] || {}, t = id => totals(sc(id));
    const v = (id, c) => { const x = sc(id)[c]; return x===undefined || x===null ? '<span class="meta">–</span>' : x; };
    const row = c => `<tr><td>${c.label}</td>${ids.map(id=>`<td>${v(id,c.id)}</td>`).join('')}</tr>`;
    const sum = (lab, f, strong) => `<tr${strong?' class="sh-tot"':''}><td><b>${lab}</b></td>${ids.map(id=>`<td><b>${f(t(id))}</b></td>`).join('')}</tr>`;
    return `<h2>${title}</h2><div class="glass tbl-wrap" style="padding:4px 12px"><table class="stats sheet-h${ids.length>3?' wide':''}">${head}<tbody>
      ${UPPER.map(row).join('')}${sum('Sous-total', x=>x.up)}${sum('Prime', x=>x.bonus)}
      ${LOWER.map(row).join('')}<tr><td>Yahtzee bonus</td>${ids.map(id=>`<td>${sc(id).yb ? '+'+sc(id).yb*100 : '<span class="meta">–</span>'}</td>`).join('')}</tr>
      ${sum('Section basse', x=>x.low)}${sum('Total', x=>x.total, true)}</tbody></table></div>`;
  }
  if(k==='skyjo'){
    const st = runSky({order:ids, rounds:sh.rounds||[]});
    const rows = st.log.map((r,i)=>`<tr><td class="meta">M${i+1}</td>${ids.map(id=>`<td>${r.fin[id]}${r.closer===id?(r.dbl?' <span class="meta">×2</span>':' <span class="meta">•</span>'):''}</td>`).join('')}</tr>`).join('');
    return `<h2>${title}</h2><div class="glass tbl-wrap" style="padding:4px 12px"><table class="stats sheet-h${ids.length>3?' wide':''}">${head}<tbody>${rows}
      <tr class="sh-tot"><td><b>Total</b></td>${ids.map(id=>`<td><b>${st.tot[id]}</b></td>`).join('')}</tr></tbody></table>
      <p class="hint" style="margin:8px 0">• a fini la manche · ×2 points doublés</p></div>`;
  }
  const L = {order:ids, rounds:sh.rounds||[], rules:sh.rules}, st = run421(L), RU = rulesOf(L);
  const lines = st.log.map((r,i) => `<div><b>${i+1}.</b> ${combo(r.c,RU).t}${r.nen?' + nénette':''} · ${r.phase==='charge' ? `${nmOf(r.l)} prend ${r.a}` : `${nmOf(r.w)} donne ${r.a} à ${nmOf(r.l)}`}</div>`);
  const firstDech = st.log.findIndex(r=>r.phase==='decharge');
  if(firstDech>0) lines.splice(firstDech, 0, `<div class="label" style="margin:8px 0 2px">Décharge</div>`);
  return `<h2>${title}</h2><div class="glass" style="padding:14px 18px">${st.log.length ? `<div class="label" style="margin:0 0 2px">Charge</div>` : ''}<div class="log">${lines.join('')}</div>
    ${st.out.length ? `<p class="hint" style="margin:12px 0 0">Ordre de sortie : ${st.out.map(nmOf).join(', ')}${st.loser ? ` · ${nmOf(st.loser)} perd` : ''}</p>` : ''}</div>`;
}
function viewResult(){
  const R = S.result; if(!R || !R.g) return viewHome();
  const g = R.g, k = kindOf(g), res = [...(g.results||[])];
  const nm = r => esc(pname(r.id, r.name));
  let rows, head;
  if(k==='421'){
    res.sort((a,b)=>(a.rank||99)-(b.rank||99));
    const loser = res.find(r=>r.id===g.loser);
    head = loser ? `${nm(loser)} <em>perd</em>` : 'Partie <em>terminée</em>';
    rows = res.map(r => { const lost = r.id===g.loser;
      return {r, rk: lost ? '✕' : r.rank, meta: lost ? 'Dernier avec des jetons' : (r.rank===1?'1er sorti':r.rank+'e sorti'), big: r.n421 ? `${r.n421}<small>× 421</small>` : '', win: r.rank===1}; });
  } else {
    const asc = k==='skyjo'; res.sort((a,b)=> asc ? a.total-b.total : b.total-a.total);
    const win = res.filter(r=>(g.winners||[]).includes(r.id));
    head = `${andList(win.map(nm))} <em>${win.length>1?'ex æquo':'gagne'}</em>`;
    rows = res.map(r => { const rk = 1 + res.filter(x => asc ? x.total<r.total : x.total>r.total).length;
      const meta = k==='yahtzee' ? [r.bonus?'prime gagnée':'', r.yz?'Yahtzee':'' , r.yb?plural(r.yb,'bonus'):''].filter(Boolean).join(' · ')
        : [r.closed?'a fini '+plural(r.closed,'manche'):'', r.doubled?plural(r.doubled,'doublement'):''].filter(Boolean).join(' · ');
      return {r, rk, meta, big:`${r.total}<small>pts</small>`, win:(g.winners||[]).includes(r.id)}; });
  }
  const when = new Date(g.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const extra = k==='yahtzee' ? '' : `${g.rounds||0} manches`;
  const canFix = R.from==='end' && R.live && !S.live[k];
  const spect = R.from==='watch';
  return `<button class="back" data-a="res-back">← ${R.from==='history'?'Parties':'Jeux'}</button>
  <div class="label">${GAMES[k].name} · ${when}${extra?' · '+extra:''}</div>
  <h1>${head}</h1>
  <p class="sub">${R.from==='end' ? 'Partie enregistrée dans l\'historique.' : spect ? `Partie de ${esc(R.owner||'ton ami')} terminée.${myPid() ? ' Elle va arriver dans ton historique.' : ''}` : 'Classement final.'}</p>
  <div class="glass" style="padding:8px 16px"><div class="list res-list">${rows.map(x=>`<div class="item${x.win?' win':''}"><span class="rk">${x.rk}</span>${spect ? wav((g.cols||{})[x.r.id], x.r.name) : av(x.r.id, pname(x.r.id,x.r.name))}<div class="grow"><div class="name">${nm(x.r)}</div>${x.meta?`<div class="meta">${x.meta}</div>`:''}</div>${x.big?`<div class="tok">${x.big}</div>`:''}</div>`).join('')}</div></div>
  ${g.src ? `<p class="hint">Reçue de ${esc(g.src.name)}</p>` : ''}
  ${viewSheet(g)}
  <div class="stack" style="margin-top:18px">
    ${spect ? '' : `<button class="btn block" data-a="res-again" id="res-again">Rejouer avec les mêmes</button>`}
    <button class="btn ghost block" data-a="res-back" id="res-back">Retour</button>
    ${canFix ? `<button class="link" style="align-self:center" data-a="res-fix" id="res-fix">Corriger la dernière saisie</button>` : ''}
  </div>`;
}

/* ================= render & events ================= */
function render(){
  if(!S.ready){ $app.innerHTML = `<div class="label">Carnet de jeux</div><h1>Un <em>instant</em>…</h1><p class="sub">Chargement des joueurs et des parties.</p>`; return; }
  if(S.locked){ $app.innerHTML = `<div class="label">Carnet de jeux</div><h1>Accès <em>réservé</em></h1><p class="sub">Ce carnet est personnel. Seul son propriétaire peut voir et noter les parties.</p>`; return; }
  const v = S.view;
  $app.innerHTML = v==='players'?viewPlayers():v==='settings'?viewSettings():v==='friends'?viewFriends():v==='friend'?viewFriend():v==='account'?viewAccountPage():v==='backup'?viewBackup():v==='player'?viewPlayer():v==='stats'?viewStats():v==='history'?viewHistory():v==='yahtzee'?viewYahtzee():v==='421'?view421():v==='skyjo'?viewSky():v==='result'?viewResult():v==='watch'?viewWatch():viewHome();
  const tabv = v==='watch' ? 'home' : v==='result' ? (S.result && S.result.from==='history' ? 'history' : 'home') : GAMES[v] ? 'home' : ['player','settings','account','backup','friends','friend'].includes(v) ? 'players' : v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===tabv));
  const f = document.getElementById('addp');
  if(f) f.onsubmit = async e => { e.preventDefault(); const i=document.getElementById('pname'); const n=i.value.trim(); if(!n) return;
    if(Object.values(S.players).some(p=>p.name.toLowerCase()===n.toLowerCase())){ toast(n+' est déjà dans la liste.'); return; }
    i.value=''; try{ await store.addPlayer(n); toast(n+' ajouté'); }catch(err){ toast("Impossible d'ajouter "+n+'. Réessaie.'); }
    setTimeout(()=>{const x=document.getElementById('pname'); x&&x.focus();},50); };

async function saveFinished(k){
  if(k==='yahtzee'){ const L=S.live.yahtzee;
    const results = L.order.map(id=>{const sc=L.scores[id]||{}; const t=totals(sc); return {id, name:pname(id,L.names[id]), total:t.total, up:t.up, bonus:t.bonus, yz:sc.yz||0, yb:sc.yb||0};});
    const max = Math.max(...results.map(r=>r.total));
    const scores = {}; L.order.forEach(id => { scores[id] = {...(L.scores[id]||{})}; });
    return {game:'yahtzee', date:Date.now(), startedAt:L.startedAt, results, winners: results.filter(r=>r.total===max).map(r=>r.id), sheet:{scores}};
  }
  if(k==='skyjo'){ const L=S.live.skyjo; const st=runSky(L);
    const results = L.order.map(id=>({id, name:pname(id,L.names[id]), total:st.tot[id], closed:st.closed[id], doubled:st.doubled[id], bestRound:st.bestRound[id]}));
    return {game:'skyjo', date:Date.now(), startedAt:L.startedAt, results, winners:st.winners, rounds:st.log.length, sheet:{rounds:JSON.parse(JSON.stringify(L.rounds||[]))}};
  }
  const L=S.live['421']; const st=run421(L);
  const results = L.order.map(id=>({id, name:pname(id,L.names[id]), rank: id===st.loser ? L.order.length : st.out.indexOf(id)+1,
    n421: st.log.filter(r=>r.w===id && r.c==='421').length}));
  return {game:'421', date:Date.now(), startedAt:L.startedAt, results, loser:st.loser, firstOut:st.out[0]||null, rounds:st.log.length, sheet:{rounds:JSON.parse(JSON.stringify(L.rounds||[])), rules:rulesOf(L)}};
}

function loadPhoto(file){
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => { const N = 256, sz = Math.min(img.naturalWidth, img.naturalHeight);
    const cv = document.createElement('canvas'); cv.width = cv.height = N; const cx = cv.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, (img.naturalWidth-sz)/2, (img.naturalHeight-sz)/2, sz, sz, 0, 0, N, N);
    URL.revokeObjectURL(url);
    const i = document.getElementById('edit-name'); if(i && S.edit) S.edit.name = i.value;
    if(S.edit){ S.edit.photo = cv.toDataURL('image/jpeg', 0.82); render(); } };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Cette image n'a pas pu être lue. Essaie avec une autre photo."); };
  img.src = url;
}

/* ================= boot ================= */
async function boot(){
  render();
  const c = window.claude;
  const [d, u] = c && c.use ? await Promise.all([c.use('db').catch(()=>null), c.use('user').catch(()=>null)]) : [null,null];
  if(u && typeof u.isOwner==='function'){ try{ if(!(await u.isOwner())){ S.locked=true; S.ready=true; render(); return; } }catch(e){} }
  if(!d){ local.load(); S.ready=true; render(); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    if(S.acct.cache) fb().catch(()=>{});
    if(S.drive.on){ loadGis().catch(()=>{}); driveAuto(); }
    document.addEventListener('visibilitychange', () => { if(!document.hidden){ driveAuto(); checkInbox(); flushSoon(); watchSync(); if(S.view==='watch') watchPoll(); else watchCheck(true); } });
    addEventListener('online', () => { checkInbox(); flushSoon(); pubSoon(); watchSync(); watchCheck(true); });
    setInterval(() => { if(!document.hidden && S.view!=='watch') watchCheck(true); }, 30000);
    return; }
  db = d;
  let got = 0; const mark = () => { if(++got>=4) S.ready=true; if(!$ov.innerHTML) render(); };
  db.collection('players').onSnapshot(s=>{ const p={}; s.docs.forEach(x=>p[x.id]=x.data()); S.players=p; mark(); }, ()=>{});
  db.collection('games').onSnapshot(s=>{ S.games=s.docs.map(x=>({...x.data(), id:x.id})); mark(); }, ()=>{});
  db.doc('settings/r421').onSnapshot(s=>{ if(s.exists) S.rules421={...DEF_RULES,...s.data()}; if(!$ov.innerHTML) render(); }, ()=>{});
  Object.keys(GAMES).forEach(k => {
    db.doc('live/'+GAMES[k].doc).onSnapshot(s=>{ const y = sync[k]; if(!y || (!y.busy && !y.timer)) S.live[k] = s.exists ? JSON.parse(JSON.stringify(s.data())) : null; mark(); }, ()=>{});
  });
}
boot();
})();

<script>
/* Offline + updates. Updating only replaces the app files; game data lives in localStorage and is never touched. */
window.APP_VERSION = '18';
if('serviceWorker' in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; location.reload(); });
  const offer = w => {
    const t = document.createElement('div'); t.className = 'toast glass'; t.style.display='flex'; t.style.gap='10px'; t.style.alignItems='center';
    t.innerHTML = 'Nouvelle version disponible <button class="btn" style="padding:8px 14px;font-size:13px">Mettre à jour</button>';
    t.querySelector('button').onclick = () => w.postMessage('skip');
    document.body.appendChild(t);
  };
  addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('sw.js');
      if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing;
        w.addEventListener('statechange', () => { if(w.state==='installed' && navigator.serviceWorker.controller) offer(w); }); });
      document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }catch(e){}
  });
}
</script>
