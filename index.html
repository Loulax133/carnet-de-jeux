<style>
/* Layout: one-column phone app, glass tab bar at the bottom, serif headlines over quiet sans data */
:root{
  --bg:#ffffff; --ink:#0c0c0c; --mute:#77767a; --line:rgba(12,12,12,.10);
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(255,255,255,.9); --glass-shadow:0 8px 32px rgba(0,0,0,.08); --cat-bg:#ffffff;
  --chip:#f2f2f3; --inv-bg:#0c0c0c; --inv-ink:#ffffff; --blob:rgba(0,0,0,.07);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --ink:#f4f4f4; --mute:#8f8e93; --line:rgba(255,255,255,.12);
  --glass:rgba(28,28,30,.55); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 8px 32px rgba(0,0,0,.5); --cat-bg:#0a0a0a;
  --chip:#1c1c1e; --inv-bg:#f4f4f4; --inv-ink:#0a0a0a; --blob:rgba(255,255,255,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --ink:#f4f4f4; --mute:#8f8e93; --line:rgba(255,255,255,.12);
  --glass:rgba(28,28,30,.55); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 8px 32px rgba(0,0,0,.5); --cat-bg:#0a0a0a;
  --chip:#1c1c1e; --inv-bg:#f4f4f4; --inv-ink:#0a0a0a; --blob:rgba(255,255,255,.07); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);background:var(--blob)}
.blobs i:nth-child(1){width:60vw;height:60vw;top:-10vw;right:-20vw}
.blobs i:nth-child(2){width:50vw;height:50vw;bottom:10vh;left:-20vw}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.01em;margin:8px 0 4px;text-wrap:balance}
h1 em{font-style:italic}
h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 20px}
.label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-radius:24px}
.btn{appearance:none;border:0;font:600 15px var(--sans);border-radius:999px;padding:14px 22px;cursor:pointer;background:var(--inv-bg);color:var(--inv-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,td.cell:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 15px var(--sans);border-radius:999px;padding:10px 16px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.on{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
input[type=text],input[type=email],input[type=password]{width:100%;min-width:0;font:400 17px var(--sans);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:22px;background:var(--inv-bg);color:var(--inv-ink)}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.meta{color:var(--mute);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.empty{padding:28px 22px;text-align:center}
.empty p{color:var(--mute);margin:6px 0 18px}
.empty .serif{font-family:var(--serif);font-size:28px}
/* score sheet */
.sheet-wrap{overflow-x:auto;border-radius:24px;-webkit-overflow-scrolling:touch}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:0;height:44px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.sheet th.cat,.sheet td.cat{text-align:left;padding:0 12px 0 16px;position:sticky;left:0;background:var(--cat-bg);z-index:1;font-weight:500;min-width:128px}
.sheet thead th{height:auto;padding:14px 8px 10px;font-weight:600;font-size:13px;vertical-align:bottom}
.sheet thead th .avatar{margin:0 auto 6px;width:34px;height:34px;font-size:18px}
.sheet td.cell{min-width:62px;cursor:pointer;font-size:17px}
.sheet td.cell.empty-c{color:transparent}
.sheet td.cell.empty-c::after{content:"";display:inline-block;width:18px;height:2px;border-radius:2px;background:var(--line);vertical-align:middle}
.sheet td.cell.zero{color:var(--mute);text-decoration:line-through}
.sheet td.cell.just{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.sheet tr.sum td{font-weight:700;background:color-mix(in srgb,var(--chip) 60%,transparent)}
.sheet tr.sum td.cat{background:var(--chip)}
.sheet tr.total td{height:58px;font-family:var(--serif);font-size:28px;font-weight:400;border-bottom:0}
.sheet tr.total td.cat{font-family:var(--sans);font-size:15px;font-weight:700}
.sheet tr.section td{height:34px;border-bottom:0}
.sheet .hint{display:block;font-size:11px;color:var(--mute);font-weight:400}
.lead td.leader{position:relative}
.crown{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans);display:block;color:var(--mute)}
/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(600px,calc(100% - 24px));z-index:31;padding:22px;border-radius:30px}
.panel h3{font-family:var(--serif);font-weight:400;font-size:28px;margin:0}
.panel .meta{margin:2px 0 16px}
.panel .foot{display:flex;gap:10px;margin-top:18px}
.panel .foot .btn{flex:1}
.wheel-box{position:relative;height:260px;margin:4px 0 0}
.wheel-band{position:absolute;left:0;right:0;top:50%;height:52px;transform:translateY(-50%);border-radius:18px;background:var(--chip);border:1px solid var(--line)}
.wheel{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding-block:104px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);overscroll-behavior:contain;outline:none}
.wheel::-webkit-scrollbar{display:none}
.wi{height:52px;display:grid;place-items:center;scroll-snap-align:center;font-family:var(--serif);font-size:34px;font-variant-numeric:tabular-nums;cursor:pointer;transition:transform .12s,opacity .12s}
.wheel:focus-visible + *, .wheel-box:focus-within .wheel-band{border-color:var(--ink)}
/* tab bar */
nav.tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:999px;width:min(420px,calc(100% - 32px))}
.tab{appearance:none;border:0;background:transparent;color:var(--mute);font:600 13px var(--sans);flex:1;padding:12px 6px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--inv-bg);color:var(--inv-ink)}
/* stats */
.podium{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.award{padding:16px;border-radius:22px;min-width:0}
.award .big{font-family:var(--serif);font-size:30px;line-height:1.05;margin:8px 0 2px;overflow-wrap:anywhere}
.award .meta{font-size:13px}
.award.hero{grid-column:1/-1;background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.award.hero .label,.award.hero .meta{color:color-mix(in srgb,var(--inv-ink) 65%,transparent)}
.award.hero .big{font-size:44px}
.tbl-wrap{overflow-x:auto}
table.stats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.stats th,.stats td{padding:12px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.stats th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats td.rank{font-family:var(--serif);font-size:20px;width:28px}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.gcard{padding:16px 18px;border-radius:22px;display:flex;flex-direction:column;gap:8px}
.gscores{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.gscores b{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{appearance:none;background:none;border:0;color:var(--mute);font:500 13px var(--sans);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:40;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hint{display:block;font-size:12px;line-height:1.35;color:var(--mute);font-weight:400;white-space:normal}
.sheet .hint{font-size:11.5px;max-width:150px}
.card{width:24px;height:34px;border-radius:6px;background:var(--inv-bg);color:var(--inv-ink);display:grid;place-items:center;font:700 11px var(--sans);font-variant-numeric:tabular-nums}
.card:nth-child(2){transform:translateY(-4px) rotate(4deg)}.card:first-child{transform:rotate(-5deg)}
.item.tap{cursor:pointer}
.chev{color:var(--mute);font-size:24px;line-height:1}
.phead{display:flex;align-items:center;gap:16px;margin:8px 0 6px}
.avatar.big{width:72px;height:72px;font-size:38px}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stile{padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);min-width:0}
.stile .v{font-family:var(--serif);font-size:34px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{appearance:none;width:44px;height:44px;border-radius:50%;border:2px solid transparent;cursor:pointer;font-family:var(--serif);font-size:22px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.spark{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:12px}
.sb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.sb span{display:block;width:100%;border-radius:6px 6px 3px 3px}
.sb em{font-style:normal;font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.catrow{display:flex;align-items:center;gap:10px}
.mdie{flex:none;width:26px;height:26px;border-radius:7px;padding:4px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  background:linear-gradient(#ffffff,#e9e9eb);box-shadow:0 2px 5px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.12),inset 0 1px 0 #fff,inset 0 -1.5px 0 rgba(0,0,0,.08)}
.mdie i{width:4.5px;height:4.5px;border-radius:50%;place-self:center;background:#0e0e0f;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}
.label .pdot{width:8px;height:8px;margin-right:6px;vertical-align:0}
.aw-who{display:flex;align-items:center;gap:10px;margin:8px 0 2px;min-width:0}
.aw-who .big{margin:0;min-width:0}
.avatar.sm{width:32px;height:32px;font-size:17px}
.award.hero .avatar.sm{width:44px;height:44px;font-size:24px}
.crowned{position:relative;display:inline-flex;flex:none}
.crown-ic{position:absolute;width:24px;height:17px;left:50%;top:-11px;transform:translateX(-50%) rotate(-14deg);transform-origin:50% 100%;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.3));z-index:1}
.phead .crown-ic{width:40px;height:28px;top:-19px}
.phead{margin-top:20px}
.pnav{display:flex;align-items:center;gap:6px;padding:10px;margin:14px 0 10px;border-radius:26px}
.navb{appearance:none;border:0;flex:none;width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--ink);font:400 28px/1 var(--sans);cursor:pointer;display:grid;place-items:center;padding-bottom:3px}
.navb:disabled{opacity:.3}
.navb:focus-visible,.pchip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pcur{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0 4px}
.pcur .name{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptot{font-family:var(--serif);font-size:36px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.ptot small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.pstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.pstrip::-webkit-scrollbar{display:none}
.pchip{appearance:none;flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 13px var(--sans);border-radius:999px;padding:8px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.pchip b{font-weight:700;margin-left:4px}
.pchip.on{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
.sheet.solo td.cat{position:static;min-width:0;width:100%}
.sheet.solo td.big{min-width:84px;font-size:22px;font-weight:500;padding-right:18px;text-align:right}
.sheet.solo tr.sum td,.sheet.solo tr.sum td.cat{background:var(--chip)}
.sheet.solo tr.sum td.big{font-size:18px;font-weight:700}
.sheet.solo tr.total td:last-child{text-align:right;padding-right:18px;font-size:34px}
.sheet.solo td.cell.empty-c::after{width:22px}
.sheet.solo th,.sheet.solo td{height:54px}
.sheet.solo tr.section td{height:34px}
.slide-l{animation:slidel .28s ease}.slide-r{animation:slider .28s ease}
@keyframes slidel{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slider{from{transform:translateX(-24px);opacity:.3}to{transform:none;opacity:1}}
.obadge{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--inv-bg);color:var(--inv-ink);font:700 11px/20px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.back{appearance:none;border:0;background:none;color:var(--mute);font:500 14px var(--sans);padding:6px 0;cursor:pointer}
.games{display:flex;flex-direction:column;gap:12px}
.gamecard{appearance:none;text-align:left;width:100%;color:var(--ink);font:inherit;cursor:pointer;padding:20px;display:flex;gap:16px;align-items:center}
.gamecard .t{font-family:var(--serif);font-size:34px;line-height:1}
.gamecard .dice{display:flex;gap:6px;flex:none}
.die{width:30px;height:30px;border-radius:8px;background:var(--inv-bg);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px}
.die i{width:5px;height:5px;border-radius:50%;background:var(--inv-ink);place-self:center}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--inv-bg);color:var(--inv-ink);margin-top:8px}
.pill.soft{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
details.rules{margin-top:16px;padding:4px 18px}
details.rules summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary::after{content:"+";font-weight:400;color:var(--mute)}
details.rules[open] summary::after{content:"–"}
details.rules ul{margin:0 0 16px;padding-left:18px;color:var(--mute);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
details.rules b{color:var(--ink);font-weight:600}
.tok{font-family:var(--serif);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.tok small{display:block;font-family:var(--sans);font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.item.out{opacity:.45}
.field{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.pickbtn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font:inherit;width:100%}
.pickbtn .c{font-family:var(--serif);font-size:28px;line-height:1}
.wi .s{font-family:var(--sans);font-size:12px;color:var(--mute);margin-left:10px}
.wi{display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--chip);border:1px solid var(--line);margin-bottom:18px;width:fit-content;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;color:var(--mute);font:600 13px var(--sans);padding:9px 16px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--inv-bg);color:var(--inv-ink)}
.log{font-size:13.5px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.log b{color:var(--ink);font-weight:600}
</style>

<div class="blobs" aria-hidden="true"><i></i><i></i></div>
<main id="app"></main>
<nav class="tabs glass" id="tabs" aria-label="Sections">
  <button class="tab on" data-v="home" id="tab-home">Jeux</button>
  <button class="tab" data-v="stats" id="tab-stats">Stats</button>
  <button class="tab" data-v="history" id="tab-history">Historique</button>
  <button class="tab" data-v="players" id="tab-players">Joueurs</button>
</nav>

<script>
(() => {
/* ================= Yahtzee ================= */
const UPPER = [
  {id:'ones',label:'As',face:1},{id:'twos',label:'Deux',face:2},{id:'threes',label:'Trois',face:3},
  {id:'fours',label:'Quatre',face:4},{id:'fives',label:'Cinq',face:5},{id:'sixes',label:'Six',face:6}];
UPPER.forEach(c => c.hint = 'Somme des '+c.face);
const LOWER = [

const ALL = [...UPPER,...LOWER];
const BONUS_AT = 63, BONUS = 35;
function totals(sc){
  sc = sc || {};
  const up = UPPER.reduce((a,c)=>a+(sc[c.id]||0),0);
  const bonus = up >= BONUS_AT ? BONUS : 0;
  const yb = (sc.yb||0)*100;
  const low = LOWER.reduce((a,c)=>a+(sc[c.id]||0),0) + yb;
  return {up, bonus, low, yb, total: up+bonus+low};
}
const filled = sc => ALL.filter(c => sc && sc[c.id] !== undefined && sc[c.id] !== null).length;

const POT = 21;
const COMBOS = [
  {id:'421',t:'4·2·1',v:10,n:'Le 421'},
  {id:'111',t:'1·1·1',v:7,n:'Trois as'},
  {id:'611',t:'6·1·1',v:6,n:'Deux as + 6'},
  {id:'666',t:'6·6·6',v:6,n:'Brelan de 6'},
  {id:'511',t:'5·1·1',v:5,n:'Deux as + 5'},
  {id:'555',t:'5·5·5',v:5,n:'Brelan de 5'},
  {id:'411',t:'4·1·1',v:4,n:'Deux as + 4'},
  {id:'444',t:'4·4·4',v:4,n:'Brelan de 4'},
  {id:'311',t:'3·1·1',v:3,n:'Deux as + 3'},
  {id:'333',t:'3·3·3',v:3,n:'Brelan de 3'},
  {id:'211',t:'2·1·1',v:2,n:'Deux as + 2'},
  {id:'222',t:'2·2·2',v:2,n:'Brelan de 2'},
  {id:'suite',t:'Suite',v:2,n:'1·2·3 à 4·5·6'},
  {id:'autre',t:'Autre',v:1,n:'Le plus gros dé l’emporte'}];
const DEF_RULES = {v421:10, nen:2};
const rulesOf = L => Object.assign({}, DEF_RULES, (L && L.rules) || {});
const combo = (id, rules) => { const c = COMBOS.find(c=>c.id===id) || COMBOS[COMBOS.length-1];
  return c.id==='421' ? {...c, v:(rules||DEF_RULES).v421} : c; };
function run421(L){
  const RU = rulesOf(L);
  const st = {tokens:{}, pot:POT, phase:'charge', out:[], done:false, loser:null, log:[]};
  L.order.forEach(id => st.tokens[id]=0);
  const active = () => L.order.filter(id => !st.out.includes(id));
  for(const r of (L.rounds||[])){
    const want = combo(r.c,RU).v + (r.nen?RU.nen:0); let a;
    if(st.phase==='charge'){
      a = Math.min(want, st.pot); st.tokens[r.l] += a; st.pot -= a;
      st.log.push({...r, a, phase:'charge'});
      if(st.pot===0){ st.phase='decharge'; L.order.forEach(id=>{ if(st.tokens[id]===0 && !st.out.includes(id)) st.out.push(id); }); }
    } else {
      a = Math.min(want, st.tokens[r.w]); st.tokens[r.w] -= a; st.tokens[r.l] += a;
      st.log.push({...r, a, phase:'decharge'});
      if(st.tokens[r.w]===0 && !st.out.includes(r.w)) st.out.push(r.w);
    }
    if(st.phase==='decharge' && active().length<=1){ st.done=true; st.loser=active()[0]||r.l; break; }
  }
  st.active = active();
  return st;
}

/* Local storage (offline version). DATA SAFETY: the key 'yz-carnet' must never change.
   Each save keeps the previous state under 'yz-carnet-prev'. New fields go through migrate(), never a reset. */
const DATA_KEY = 'yz-carnet', PREV_KEY = 'yz-carnet-prev', DATA_V = 1;
function migrate(d){
  if(!d || typeof d!=='object') return null;
  const out = {v:DATA_V, players:d.players||{}, games:Array.isArray(d.games)?d.games:[], lives:{}, rules421:d.rules421||null, savedAt:d.savedAt||0, exportedAt:d.exportedAt||0};
  if(d.live && d.live.order) out.lives.yahtzee = d.live;
  if(d.lives) Object.assign(out.lives, d.lives);
  return out;
}
function applyData(d){
  S.players = d.players; S.games = d.games;
  S.live = Object.assign({yahtzee:null,'421':null,skyjo:null}, d.lives);
  if(d.rules421) S.rules421 = {...DEF_RULES, ...d.rules421};
  S.exportedAt = d.exportedAt||0;
}
const local = {
  read(key){ try{ return migrate(JSON.parse(localStorage.getItem(key)||'null')); }catch(e){ return null; } },
  load(){ const d = local.read(DATA_KEY) || local.read(PREV_KEY); if(d) applyData(d); },
  snapshot(){ return {v:DATA_V, players:S.players, games:S.games, lives:S.live, rules421:S.rules421, savedAt:Date.now(), exportedAt:S.exportedAt||0}; },
  save(){ try{ const cur = localStorage.getItem(DATA_KEY); if(cur) localStorage.setItem(PREV_KEY, cur);
      localStorage.setItem(DATA_KEY, JSON.stringify(local.snapshot())); }
    catch(e){ toast("Sauvegarde impossible sur ce téléphone. Exporte tes données par sécurité."); } }
};
async function exportData(){
  S.exportedAt = Date.now(); local.save();
  const day = new Date().toISOString().slice(0,10);
  const name = `carnet-de-jeux-${day}.json`;
  const blob = new Blob([JSON.stringify({app:'carnet-de-jeux', ...local.snapshot()}, null, 1)], {type:'application/json'});
  try{ const file = new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Sauvegarde Carnet de jeux'}); render(); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000); render();
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => { let raw = null; try{ raw = JSON.parse(fr.result); }catch(e){}
    mergeData(raw); };
  fr.readAsText(file);
}
/* Fusion d'une sauvegarde (fichier ou Drive) : ajoute ce qui manque par id, n'efface et ne remplace jamais rien. */
function mergeData(raw){
  { const d = migrate(raw);
    if(!d || (!Object.keys(d.players).length && !d.games.length)){ toast("Ce fichier n'est pas une sauvegarde du Carnet de jeux."); return; }
    let np=0, ng=0;
    Object.entries(d.players).forEach(([id,p])=>{ if(!S.players[id]){ S.players[id]=p; np++; } });
    const have = new Set(S.games.map(g=>g.id));
    d.games.forEach(g=>{ if(g && g.id && !have.has(g.id)){ S.games.push(g); ng++; } });
    Object.keys(d.lives||{}).forEach(k=>{ if(!S.live[k] && d.lives[k]) S.live[k]=d.lives[k]; });
    local.save(); render(); toast(`${plural(np,'joueur')} et ${plural(ng,'partie')} ajoutés`); }
}

    if(db){ await db.doc('players/'+id).set(p); } else { S.players[id]=p; local.save(); render(); } },
  async updatePlayer(id, patch){ if(db){ await db.doc('players/'+id).update(patch); } else { S.players[id]={...S.players[id],...patch}; local.save(); render(); } },

/* ================= Skyjo ================= */
const SKY_END = 100;
function runSky(L){
  const tot = {}, closed = {}, doubled = {}, bestRound = {}; L.order.forEach(id=>{tot[id]=0;closed[id]=0;doubled[id]=0;bestRound[id]=null;});
  const log = [];
  for(const r of (L.rounds||[])){
    const fin = {...r.scores}; const c = r.closer; let dbl = false;
    if(c && fin[c] > 0 && L.order.some(id => id!==c && r.scores[id] <= r.scores[c])){ fin[c] = r.scores[c]*2; dbl = true; doubled[c]++; }
    if(c) closed[c]++;
    L.order.forEach(id => { tot[id] += fin[id]||0; if(bestRound[id]===null || r.scores[id] < bestRound[id]) bestRound[id] = r.scores[id]; });
    log.push({raw:r.scores, fin, closer:c, dbl});
  }
  const done = log.length>0 && L.order.some(id => tot[id] >= SKY_END);
  const min = Math.min(...L.order.map(id=>tot[id]));
  return {tot, closed, doubled, bestRound, log, done, winners: L.order.filter(id=>tot[id]===min), lead: min};
}
const rulesSky = (open) => `<details class="rules glass"${open?' open':''}><summary>Règles en bref</summary><ul>
  <li>Chacun a <b>12 cartes</b> face cachée en 3 rangées de 4, et en retourne 2 au départ. Les cartes valent de <b>−2 à 12</b>.</li>
  <li>À ton tour, tu prends la défausse ou la pioche. Tu échanges la carte avec une des tiennes, ou tu la jettes et retournes une carte cachée.</li>
  <li><b>Colonne de 3 cartes identiques</b> : tu la défausses, elle ne compte plus.</li>
  <li>Quand un joueur a retourné toutes ses cartes, chacun joue <b>un dernier tour</b>, puis on retourne tout et on additionne.</li>
  <li>Celui qui a fini la manche doit avoir le <b>score le plus bas, seul</b>. Sinon ses points de la manche sont <b>doublés</b>, s'ils sont positifs.</li>
  <li>La partie s'arrête quand quelqu'un atteint <b>${SKY_END} points</b>. Le plus petit total gagne.</li></ul></details>`;

  ${endControls('skyjo', st.done, `Enregistrer la victoire de ${st.winners.map(nm).join(' & ')} dans l'historique ?`)}
  ${rulesSky(false)}`;
}
function statsS(id){
  const st = {played:0,wins:0,sum:0,best:null,closed:0,doubled:0,bestRound:null};
  S.games.filter(g=>kindOf(g)==='skyjo').forEach(g => { const r=(g.results||[]).find(r=>r.id===id); if(!r) return;
    st.played++; st.sum += r.total; st.best = st.best===null ? r.total : Math.min(st.best, r.total);
    st.closed += r.closed||0; st.doubled += r.doubled||0;
    if(r.bestRound!==null && r.bestRound!==undefined) st.bestRound = st.bestRound===null ? r.bestRound : Math.min(st.bestRound, r.bestRound);
    if((g.winners||[]).includes(id)) st.wins++; });
  st.avg = st.played ? Math.round(st.sum/st.played) : 0; st.rate = st.played ? st.wins/st.played : 0;
  return st;
}

const inkOn = hex => { const n=parseInt(hex.slice(1),16), r=n>>16, g=n>>8&255, b=n&255; return (0.299*r+0.587*g+0.114*b) > 170 ? '#111111' : '#ffffff'; };
const colorOf = id => { const p = S.players[id]; const c = p && COLORS.find(x=>x.id===p.color); return c && c.c ? c.c : null; };
const photoOf = id => (S.players[id] && S.players[id].photo) || null;
const photoStyle = (ph, c) => `background:var(--chip) center/cover no-repeat url('${ph}');color:transparent;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px ${c||'var(--line)'}`;
const avStyle = id => { const c = colorOf(id), ph = photoOf(id); if(ph) return photoStyle(ph, c); return c ? `background:${c};color:${inkOn(c)}` : ''; };
/* Best player: highest win rate across all games (Yahtzee and Skyjo wins, 421 games not lost), at least CROWN_MIN games. Tie-break: more wins. No crown on a tie. */
const CROWN_MIN = 3;
function bestPlayer(){
  const sc = {}; const add = (id,w) => { const x = sc[id] || (sc[id]={w:0,n:0}); x.n++; x.w+=w; };
  S.games.forEach(g => { const k = kindOf(g);
    (g.results||[]).forEach(r => add(r.id, k==='421' ? (g.loser!==r.id?1:0) : ((g.winners||[]).includes(r.id)?1:0))); });
  const rows = Object.entries(sc).filter(([id,x])=>S.players[id] && x.n>=CROWN_MIN).map(([id,x])=>({id, w:x.w, rate:x.w/x.n})).sort((a,b)=>b.rate-a.rate||b.w-a.w);
  if(!rows.length || !rows[0].w) return null;
  if(rows[1] && rows[1].rate===rows[0].rate && rows[1].w===rows[0].w) return null;
  return rows[0].id;
}
let crownN = 0;
const crownSvg = () => { const g = 'gd'+(crownN++);
  return `<svg class="crown-ic" viewBox="0 0 32 22" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE58A"/><stop offset=".55" stop-color="#E8B530"/><stop offset="1" stop-color="#B9841A"/></linearGradient></defs>
  <path d="M3 8.5 9.5 13 16 3l6.5 10L29 8.5 26.5 19h-21Z" fill="url(#${g})" stroke="#9A6B10" stroke-width=".8" stroke-linejoin="round"/>

  <circle cx="16" cy="3" r="1.9" fill="#FFF4C2" stroke="#9A6B10" stroke-width=".6"/><circle cx="3" cy="8.5" r="1.6" fill="#FFF4C2" stroke="#9A6B10" stroke-width=".6"/><circle cx="29" cy="8.5" r="1.6" fill="#FFF4C2" stroke="#9A6B10" stroke-width=".6"/></svg>`; };
const crowned = (html, on) => on ? `<span class="crowned">${crownSvg()}${html}</span>` : html;
const dot = id => { const c = colorOf(id); return `<span class="pdot" style="background:${c||'currentColor'}"></span>`; };
const barC = id => colorOf(id) ? `;background:${colorOf(id)}` : '';

/* ================= wheel picker ================= */
function wheel({who, whoId, title, meta, opts, start, onOk, onClear}){
  let idx = Math.max(0, start);
  $ov.innerHTML = `<div class="scrim" data-close></div><div class="panel glass" role="dialog" aria-label="${esc(title)}">
    <div class="label">${whoId?dot(whoId):""}${esc(who)}</div><h3>${esc(title)}</h3><div class="meta">${meta}</div>
    <div class="wheel-box"><div class="wheel-band" aria-hidden="true"></div>
      <div class="wheel" id="wheel" tabindex="0" role="listbox" aria-label="${esc(title)}">${opts.map((o,i)=>`<div class="wi" role="option" data-i="${i}">${o.t}${o.s?`<span class="s">${o.s}</span>`:''}</div>`).join('')}</div></div>
    <div class="foot">${onClear?'<button class="btn ghost" data-clear>Effacer</button>':'<button class="btn ghost" data-close>Fermer</button>'}<button class="btn" data-ok>Valider</button></div></div>`;
  const w = document.getElementById('wheel'); const items = [...w.children]; const H = 52;
  const paint = () => { const mid = w.scrollTop / H;
    items.forEach((el,i)=>{ const d = Math.min(Math.abs(i-mid),3); el.style.opacity = 1 - d*0.3; el.style.transform = `scale(${1 - d*0.14})`; el.setAttribute('aria-selected', i===idx); }); };
  let raf=0; w.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>{ idx = Math.max(0,Math.min(opts.length-1, Math.round(w.scrollTop/H))); paint(); }); });
  const to = (i, smooth) => { idx = Math.max(0,Math.min(opts.length-1,i)); w.scrollTo({top: idx*H, behavior: smooth?'smooth':'auto'}); paint(); };
  requestAnimationFrame(()=>to(idx,false));
  const ok = () => { closePanel(); onOk(opts[idx]); };
  w.addEventListener('keydown', e => { if(e.key==='ArrowDown'){e.preventDefault();to(idx+1,true);} else if(e.key==='ArrowUp'){e.preventDefault();to(idx-1,true);} else if(e.key==='Enter'){e.preventDefault();ok();} });
  $ov.onclick = e => {
    if(e.target.closest('[data-close]')){ closePanel(); return; }
    const it = e.target.closest('.wi'); if(it){ to(Number(it.dataset.i), true); return; }
    if(e.target.closest('[data-ok]')) ok();
    else if(e.target.closest('[data-clear]')){ closePanel(); onClear(); }
  };
  w.focus({preventScroll:true});
}
function closePanel(){ $ov.innerHTML=''; $ov.onclick=null; }
document.addEventListener('keydown', e => { if(e.key==='Escape') closePanel(); });

function openCell(pid, cid){
  const L = S.live.yahtzee; const c = ALL.find(x=>x.id===cid); const cur = (L.scores[pid]||{})[cid];
  let opts, title = c ? c.label : 'Yahtzee bonus', meta, def = 0;
  if(cid==='yb'){ opts=[0,1,2,3,4].map(n=>({v:n,t:n?'+'+n*100:'0'})); meta='Un nouveau Yahtzee alors que la case Yahtzee est déjà à 50 rapporte 100.'; }
  else if(c.face){ opts=[0,1,2,3,4,5].map(n=>({v:n*c.face,t:String(n*c.face)})); meta=`Additionne seulement les ${c.face}. Exemple : trois ${c.face} = ${3*c.face}.`; }
  else if(c.fixed){ opts=[{v:0,t:'0'},{v:c.fixed,t:String(c.fixed)}]; def=c.fixed; meta=c.hint.split(' · ')[0]+'. Sinon, la case est barrée à 0.'; }
  else { opts=[{v:0,t:'0'}].concat(Array.from({length:26},(_,i)=>({v:i+5,t:String(i+5)}))); meta = c.id==='ch' ? 'Aucune condition : additionne les cinq dés.' : c.hint.split(' · ')[0]+', puis additionne les cinq dés, pas seulement ceux qui sont pareils.'; }
  const start = cur!==undefined && cur!==null ? cur : def;
  const wasEmpty = cur===undefined || cur===null;
  const set = v => { const sc = {...(L.scores[pid]||{})}; if(v===null) delete sc[cid]; else sc[cid]=v;
    L.scores = {...L.scores, [pid]: sc}; S.just = pid+cid; saveLiveSoon('yahtzee'); setTimeout(()=>{S.just=null},400);
    if(v!==null && wasEmpty && cid!=='yb' && L.order.length>1){ setTimeout(()=>{ S.just=null; yzMove(1); }, 420); } };

async function onUser(u){

const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode = () => { const a = new Uint32Array(6); crypto.getRandomValues(a); return [...a].map(x=>CODE_ABC[x % CODE_ABC.length]).join(''); };
async function createProfile(uid, name){
  const {m, fs} = FB;
  for(let i=0; i<6; i++){ const code = genCode();
    try{ await m.runTransaction(fs, async tx => { const cref = m.doc(fs, 'codes', code);
        if((await tx.get(cref)).exists()) throw new Error('taken');
        tx.set(cref, {uid}); tx.set(m.doc(fs, 'users', uid), {name, code, createdAt:m.serverTimestamp()}); });
      setProfile({name, code}); return;
    }catch(e){ if(e.message!=='taken') throw e; } }
  throw new Error('code');
}

/* ================= sauvegarde Google Drive =================
   Accès « drive.file » : l'app ne voit que les fichiers qu'elle a créés. JSON lisible, 10 dernières sauvegardes gardées.
   Une PWA ne peut pas tourner en tâche de fond : on sauvegarde à l'ouverture et après chaque partie quand le jeton Google
   est encore valide, sinon on affiche un rappel qui demande un toucher (la fenêtre Google exige un geste). */
const DRIVE_CLIENT = '668352623353-u65fm6l3a2q6a6vqjmo752cctd2tg9tk.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_KEY = 'yz-drive', DRIVE_TOK = 'yz-drive-tok', DRIVE_KEEP = 10, DRIVE_FOLDER = 'Carnet de jeux';
const DRIVE_AUTO = 12*3600*1000, DRIVE_DUE = 3*86400*1000;
S.drive = Object.assign({on:false, folderId:null, last:0}, lsGet(DRIVE_KEY) || {}, {busy:false, err:null, list:null});
const driveSave = () => lsSet(DRIVE_KEY, {on:S.drive.on, folderId:S.drive.folderId, last:S.drive.last});
let gisP = null, tokClient = null, tokWait = null;
function loadGis(){
  if(!gisP) gisP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => { gisP = null; rej(new Error('gis')); }; document.head.appendChild(s); });

}
const tokNow = () => { const t = lsGet(DRIVE_TOK); return t && t.exp > Date.now() + 60000 ? t.t : null; };
function askToken(){
  /* Doit être appelé directement depuis un toucher, sinon le navigateur bloque la fenêtre Google. */
  if(!window.google || !google.accounts || !google.accounts.oauth2){ loadGis().catch(()=>{}); return Promise.reject(new Error('gis-wait')); }
  if(!tokClient) tokClient = google.accounts.oauth2.initTokenClient({client_id:DRIVE_CLIENT, scope:DRIVE_SCOPE,
    callback: r => { const w = tokWait; tokWait = null; if(!w) return;
      if(r && r.access_token){ lsSet(DRIVE_TOK, {t:r.access_token, exp:Date.now() + (Number(r.expires_in)||3600)*1000}); w.res(r.access_token); }
      else w.rej(new Error((r && r.error) || 'denied')); },
    error_callback: e => { const w = tokWait; tokWait = null; if(w) w.rej(new Error((e && e.type) || 'popup')); }});
  return new Promise((res, rej) => { tokWait = {res, rej}; tokClient.requestAccessToken({prompt:''}); });
}
async function gapi(path, opt={}, upload=false){
  const t = tokNow(); if(!t) throw new Error('token');
  const r = await fetch((upload ? 'https://www.googleapis.com/upload/drive/v3/' : 'https://www.googleapis.com/drive/v3/') + path,
    {...opt, headers:{...(opt.headers||{}), Authorization:'Bearer '+t}});
  if(r.status===401){ lsSet(DRIVE_TOK, null); throw new Error('token'); }
  if(!r.ok) throw new Error('drive '+r.status);
  return r;
}
const q = s => encodeURIComponent(s);
async function driveFolder(){
  if(S.drive.folderId){ try{ const f = await (await gapi('files/'+S.drive.folderId+'?fields=id,trashed')).json(); if(!f.trashed) return f.id; }catch(e){ if(e.message==='token') throw e; } }
  const found = await (await gapi(`files?q=${q(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)&spaces=drive`)).json();
  let id = found.files && found.files[0] && found.files[0].id;
  if(!id){ const f = await (await gapi('files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:DRIVE_FOLDER, mimeType:'application/vnd.google-apps.folder'})})).json(); id = f.id; }

async function driveList(folder){

async function driveRun(fn, interactive){

    <p class="hint" style="margin:6px 0 14px">Sauvegarde automatique à l'ouverture et après chaque partie quand Google est connecté. Les ${DRIVE_KEEP} dernières sont gardées.</p>
    <div class="row"><button class="btn" data-a="drive-now" ${D.busy?'disabled':''}>${D.busy?'Un instant…':'Sauvegarder maintenant'}</button><button class="btn ghost" data-a="drive-list" ${D.busy?'disabled':''}>${D.list?'Actualiser':'Voir les sauvegardes'}</button></div>
    ${list}<button class="link" data-a="drive-off" style="margin-top:8px">Déconnecter Google Drive</button>${err}</div>`;
}
async function driveAction(a, el){
  const D = S.drive;
  /* On appelle la fenêtre Google tout de suite, dans le toucher : pas d'attente avant. */
  if(a==='drive-on'){ D.on = true; driveSave(); await driveRun(async () => { await driveBackupNow(); toast('Drive connecté, première sauvegarde faite'); }, true);
    if(!D.last){ D.on = false; driveSave(); render(); } }
  else if(a==='drive-now'){ await driveRun(async () => { await driveBackupNow(); toast('Sauvegarde Drive faite'); }, true); }
  else if(a==='drive-list'){ await driveRun(async () => { D.list = await driveList(await driveFolder()); }, true); }
  else if(a==='drive-file'){ const id = el.dataset.drivefile;
    await driveRun(async () => { const d = await (await gapi('files/'+id+'?alt=media')).json(); mergeData(d); }, true); }
  else if(a==='drive-off'){ const t = tokNow(); if(t && window.google && google.accounts) try{ google.accounts.oauth2.revoke(t, ()=>{}); }catch(e){}
    lsSet(DRIVE_TOK, null); D.on = false; D.list = null; D.err = null; driveSave(); render(); toast('Drive déconnecté. Les sauvegardes restent dans ton Drive.'); }
}

/* ================= render & events ================= */
function render(){
  if(!S.ready){ $app.innerHTML = `<div class="label">Carnet de jeux</div><h1>Un <em>instant</em>…</h1><p class="sub">Chargement des joueurs et des parties.</p>`; return; }
  if(S.locked){ $app.innerHTML = `<div class="label">Carnet de jeux</div><h1>Accès <em>réservé</em></h1><p class="sub">Ce carnet est personnel. Seul son propriétaire peut voir et noter les parties.</p>`; return; }
  const v = S.view;
  $app.innerHTML = v==='players'?viewPlayers():v==='settings'?viewSettings():v==='account'?viewAccountPage():v==='backup'?viewBackup():v==='player'?viewPlayer():v==='stats'?viewStats():v==='history'?viewHistory():v==='yahtzee'?viewYahtzee():v==='421'?view421():v==='skyjo'?viewSky():viewHome();
  const tabv = GAMES[v] ? 'home' : ['player','settings','account','backup'].includes(v) ? 'players' : v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===tabv));
  const f = document.getElementById('addp');
  if(f) f.onsubmit = async e => { e.preventDefault(); const i=document.getElementById('pname'); const n=i.value.trim(); if(!n) return;
    if(Object.values(S.players).some(p=>p.name.toLowerCase()===n.toLowerCase())){ toast(n+' est déjà dans la liste.'); return; }
    i.value=''; try{ await store.addPlayer(n); toast(n+' ajouté'); }catch(err){ toast("Impossible d'ajouter "+n+'. Réessaie.'); }
    setTimeout(()=>{const x=document.getElementById('pname'); x&&x.focus();},50); };
  ['acct-form','acct-rename-form','acct-fix-form','acct-del-form'].forEach(id => { const g = document.getElementById(id); if(g) g.onsubmit = e => { e.preventDefault(); acctForm(id); }; });
}
function go(v){ S.view=v; S.confirm=null; S.edit=null; render(); window.scrollTo(0,0); }
document.getElementById('tabs').onclick = e => { const t=e.target.closest('.tab'); if(t) go(t.dataset.v); };

async function saveFinished(k){
  if(k==='yahtzee'){ const L=S.live.yahtzee;
    const results = L.order.map(id=>{const sc=L.scores[id]||{}; const t=totals(sc); return {id, name:pname(id,L.names[id]), total:t.total, up:t.up, bonus:t.bonus, yz:sc.yz||0, yb:sc.yb||0};});
    const max = Math.max(...results.map(r=>r.total));
    return {game:'yahtzee', date:Date.now(), startedAt:L.startedAt, results, winners: results.filter(r=>r.total===max).map(r=>r.id)};
  }
  if(k==='skyjo'){ const L=S.live.skyjo; const st=runSky(L);
    const results = L.order.map(id=>({id, name:pname(id,L.names[id]), total:st.tot[id], closed:st.closed[id], doubled:st.doubled[id], bestRound:st.bestRound[id]}));
    return {game:'skyjo', date:Date.now(), startedAt:L.startedAt, results, winners:st.winners, rounds:st.log.length};
  }
  const L=S.live['421']; const st=run421(L);
  const results = L.order.map(id=>({id, name:pname(id,L.names[id]), rank: id===st.loser ? L.order.length : st.out.indexOf(id)+1,
    n421: st.log.filter(r=>r.w===id && r.c==='421').length}));
  return {game:'421', date:Date.now(), startedAt:L.startedAt, results, loser:st.loser, firstOut:st.out[0]||null, rounds:st.log.length};
}

$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-a],[data-pick],[data-rm],[data-rm-yes],[data-rg],[data-rg-yes],[data-seg],[data-rule],[data-r],[data-closer],[data-player],[data-color],[data-yzp],[data-drivefile],td.cell'); if(!el) return;
  if(el.matches('td.cell')){ openCell(el.dataset.p, el.dataset.c); return; }
  if(el.dataset.go){ go(el.dataset.go); return; }
  if(el.dataset.yzp){ const i=Number(el.dataset.yzp); if(i!==S.yzp){ S.yzAnim = i>S.yzp?'l':'r'; S.yzp=i; render(); } return; }
  if(el.dataset.player){ S.pid=el.dataset.player; go('player'); return; }
  if(el.dataset.color){ const i=document.getElementById('edit-name'); if(i) S.edit.name=i.value; S.edit.color=el.dataset.color; render(); return; }
  if(el.dataset.seg){ S[el.dataset.seg]=el.dataset.val; render(); return; }
  if(el.dataset.closer){ S.sky.closer = S.sky.closer===el.dataset.closer ? null : el.dataset.closer; render(); return; }
  if(el.dataset.rule){ S.rules421 = {...S.rules421, [el.dataset.rule]: Number(el.dataset.val)}; render();
    if(db){ try{ await db.doc('settings/r421').set(S.rules421); }catch(err){ toast("Le réglage n'a pas pu être enregistré."); } } else local.save(); return; }
  if(el.dataset.r){ const R=S.r421; R[el.dataset.r] = R[el.dataset.r]===el.dataset.id ? null : el.dataset.id; render(); return; }
  if(el.dataset.pick){ const s=S.pick[el.dataset.k]; s.has(el.dataset.pick)?s.delete(el.dataset.pick):s.add(el.dataset.pick); render(); return; }
  if(el.dataset.rm){ S.confirm='rm-'+el.dataset.rm; render(); return; }
  if(el.dataset.rmYes){ const id=el.dataset.rmYes; S.confirm=null; try{ await store.removePlayer(id); toast('Joueur retiré'); go('players'); }catch(err){ toast('Impossible de retirer ce joueur.'); } return; }
  if(el.dataset.rg){ S.confirm='rg-'+el.dataset.rg; render(); return; }
  if(el.dataset.rgYes){ const id=el.dataset.rgYes; S.confirm=null; try{ await store.removeGame(id); toast('Partie supprimée'); }catch(err){ toast('Impossible de supprimer la partie.'); } return; }
  if(el.dataset.drivefile){ driveAction('drive-file', el); return; }
  const a = el.dataset.a, k = el.dataset.k;
  if(a && a.startsWith('acct-')){ acctAction(a); return; }
  if(a && a.startsWith('drive-')){ driveAction(a, el); return; }
  if(a==='cancel'){ S.confirm=null; render(); }
  else if(a==='start'){ const order=[...S.pick[k]]; const names={}; order.forEach(id=>names[id]=S.players[id].name);
    S.pick[k]=new Set(); S.yzp=0; S.r421={c:'421',w:null,l:null,nen:false}; S.sky={scores:{},closer:null};
    await store.setLive(k, k==='yahtzee' ? {order, names, scores:{}, startedAt:Date.now()} : k==='skyjo' ? {order, names, rounds:[], startedAt:Date.now()} : {order, names, rounds:[], rules:{...S.rules421}, startedAt:Date.now()}); }
  else if(a==='combo'){ const i = COMBOS.findIndex(c=>c.id===S.r421.c);
    wheel({who:'Meilleure combinaison', title:'Combinaison', meta:'De la plus forte à la plus faible. Le chiffre à droite, c’est le nombre de jetons.', opts:COMBOS.map(c=>combo(c.id,rulesOf(S.live['421']))).map(c=>({v:c.id,t:c.t,s:plural(c.v,'jeton')})), start:i, onOk:o=>{S.r421.c=o.v; render();}}); }
  else if(a==='sky-score'){ const id=el.dataset.id, L=S.live.skyjo; const cur=S.sky.scores[id];
    const opts=[]; for(let v=-24; v<=144; v++) opts.push({v, t:v<0?'−'+(-v):String(v)});
    wheel({who:pname(id,L.names[id]), whoId:id, title:'Points de la manche', meta:'Somme des cartes restantes, de −2 à 12 chacune. Une colonne de 3 cartes identiques ne compte pas.',
      opts, start: opts.findIndex(o=>o.v===(cur===undefined?0:cur)), onOk:o=>{ S.sky.scores={...S.sky.scores,[id]:o.v}; render(); },
      onClear:()=>{ const sc={...S.sky.scores}; delete sc[id]; S.sky.scores=sc; render(); }}); }
  else if(a==='sky-round'){ const L=S.live.skyjo, R=S.sky; if(!R.closer || !L.order.every(id=>R.scores[id]!==undefined)) return;
    L.rounds=[...(L.rounds||[]), {scores:{...R.scores}, closer:R.closer}]; S.sky={scores:{},closer:null}; saveLiveSoon('skyjo'); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a==='sky-undo'){ const L=S.live.skyjo; L.rounds=(L.rounds||[]).slice(0,-1); saveLiveSoon('skyjo'); }
  else if(a==='yz-prev'){ yzMove(-1); }
  else if(a==='yz-next'){ yzMove(1); }
  else if(a==='photo-rm'){ const i=document.getElementById('edit-name'); if(i) S.edit.name=i.value; S.edit.photo=null; render(); }
  else if(a==='export'){ exportData(); }
  else if(a==='edit'){ const p=S.players[S.pid]; S.edit={id:S.pid, name:p.name, color:p.color||'noir', photo:p.photo||null}; S.confirm=null; render(); }
  else if(a==='edit-cancel'){ S.edit=null; S.confirm=null; render(); }
  else if(a==='edit-save'){ const E=S.edit, i=document.getElementById('edit-name'); const n=(i?i.value:E.name).trim();
    if(!n){ toast('Le prénom ne peut pas être vide.'); return; }
    if(Object.entries(S.players).some(([pid,p])=>pid!==E.id && p.name.toLowerCase()===n.toLowerCase())){ toast(n+' existe déjà.'); return; }
    try{ await store.updatePlayer(E.id, {name:n, color:E.color, photo:E.photo||null}); S.edit=null; toast('Profil enregistré'); render(); }catch(err){ toast("Le profil n'a pas pu être enregistré."); } }
  else if(a==='nen'){ S.r421.nen=!S.r421.nen; render(); }
  else if(a==='round'){ const R=S.r421, L=S.live['421']; if(!R.w||!R.l) return;
    L.rounds = [...(L.rounds||[]), {c:R.c, w:R.w, l:R.l, nen:R.nen}];
    S.r421 = {c:'421', w:null, l:null, nen:false}; saveLiveSoon('421'); }
  else if(a==='undo'){ const L=S.live['421']; L.rounds = (L.rounds||[]).slice(0,-1); saveLiveSoon('421'); }
  else if(a==='end'){ S.confirm='end'; render(); }
  else if(a==='abandon'){ S.confirm='abandon'; render(); }
  else if(a==='abandon-yes'){ S.confirm=null; await store.setLive(k, null); }
  else if(a==='end-yes'){ S.confirm=null;
    try{ const g = await saveFinished(k); await store.addGame(g); await store.setLive(k, null); toast('Partie enregistrée'); S.sgame=k; go('stats');
      if(!db && S.drive.on && tokNow()) driveRun(driveBackupNow, false); }
    catch(err){ toast("La partie n'a pas pu être enregistrée. Réessaie."); render(); } }
});
let sw0=null;
$app.addEventListener('touchstart', e => { if(e.target.closest('#yzsheet') && e.touches.length===1) sw0={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}; else sw0=null; }, {passive:true});
$app.addEventListener('touchend', e => { if(!sw0) return; const t=e.changedTouches[0], dx=t.clientX-sw0.x, dy=t.clientY-sw0.y;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5 && Date.now()-sw0.t<600) yzMove(dx<0?1:-1); sw0=null; }, {passive:true});
function loadPhoto(file){
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => { const N = 256, sz = Math.min(img.naturalWidth, img.naturalHeight);
    const cv = document.createElement('canvas'); cv.width = cv.height = N; const cx = cv.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, (img.naturalWidth-sz)/2, (img.naturalHeight-sz)/2, sz, sz, 0, 0, N, N);
    URL.revokeObjectURL(url);
    const i = document.getElementById('edit-name'); if(i && S.edit) S.edit.name = i.value;
    if(S.edit){ S.edit.photo = cv.toDataURL('image/jpeg', 0.82); render(); } };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Cette image n'a pas pu être lue. Essaie avec une autre photo."); };
  img.src = url;
}
$app.addEventListener('change', e => { if(e.target.id==='photo-file' && e.target.files[0]){ loadPhoto(e.target.files[0]); e.target.value=''; return; } if(e.target.id==='import-file' && e.target.files[0]){ importData(e.target.files[0]); e.target.value=''; } });
$app.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches('td.cell,[data-pick],[data-player],.item[data-go]')){ e.preventDefault(); e.target.click(); } });

/* ================= boot ================= */
async function boot(){
  render();
  const c = window.claude;
  const [d, u] = c && c.use ? await Promise.all([c.use('db').catch(()=>null), c.use('user').catch(()=>null)]) : [null,null];
  if(u && typeof u.isOwner==='function'){ try{ if(!(await u.isOwner())){ S.locked=true; S.ready=true; render(); return; } }catch(e){} }
  if(!d){ local.load(); S.ready=true; render(); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    if(S.acct.cache) fb().catch(()=>{});
    if(S.drive.on){ loadGis().catch(()=>{}); driveAuto(); }
    document.addEventListener('visibilitychange', () => { if(!document.hidden) driveAuto(); });
    return; }
  db = d;
  let got = 0; const mark = () => { if(++got>=4) S.ready=true; if(!$ov.innerHTML) render(); };
  db.collection('players').onSnapshot(s=>{ const p={}; s.docs.forEach(x=>p[x.id]=x.data()); S.players=p; mark(); }, ()=>{});
  db.collection('games').onSnapshot(s=>{ S.games=s.docs.map(x=>({...x.data(), id:x.id})); mark(); }, ()=>{});
  db.doc('settings/r421').onSnapshot(s=>{ if(s.exists) S.rules421={...DEF_RULES,...s.data()}; if(!$ov.innerHTML) render(); }, ()=>{});
  Object.keys(GAMES).forEach(k => {
    db.doc('live/'+GAMES[k].doc).onSnapshot(s=>{ const y = sync[k]; if(!y || (!y.busy && !y.timer)) S.live[k] = s.exists ? JSON.parse(JSON.stringify(s.data())) : null; mark(); }, ()=>{});
  });
}
boot();
})();
</script>

<script>
/* Offline + updates. Updating only replaces the app files; game data lives in localStorage and is never touched. */
window.APP_VERSION = '11';
if('serviceWorker' in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; location.reload(); });
  const offer = w => {
    const t = document.createElement('div'); t.className = 'toast glass'; t.style.display='flex'; t.style.gap='10px'; t.style.alignItems='center';
    t.innerHTML = 'Nouvelle version disponible <button class="btn" style="padding:8px 14px;font-size:13px">Mettre à jour</button>';
    t.querySelector('button').onclick = () => w.postMessage('skip');
    document.body.appendChild(t);
  };
  addEventListener('load', async () => {
    try{
      const reg = await navigator.serviceWorker.register('sw.js');
      if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing;
        w.addEventListener('statechange', () => { if(w.state==='installed' && navigator.serviceWorker.controller) offer(w); }); });
      document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); });
    }catch(e){}
  });
}
</script>
